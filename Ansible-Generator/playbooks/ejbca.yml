---
- name: Native install of EJBCA CE on Ubuntu (WildFly 36 + MariaDB, robust CLI deploy + HTTPS)
  hosts: ejbca
  become: yes
  gather_facts: yes

  collections:
    - community.mysql

  vars:
    # ===== Versions & Paths =====
    java_pkg: openjdk-17-jdk

    wildfly_version: "36.0.1.Final"
    wildfly_tarball: "wildfly-{{ wildfly_version }}.tar.gz"
    wildfly_url: "https://github.com/wildfly/wildfly/releases/download/{{ wildfly_version }}/{{ wildfly_tarball }}"
    # Official SHA256 for 36.0.1.Final tgz
    wildfly_sha256: "1a0f71680cac962cef03173e81f5ff8886175f18292db158b75c8077cf4ac38d"

    wildfly_user: "wildfly"
    wildfly_group: "wildfly"
    wildfly_home: "/opt/wildfly"
    wildfly_bind: "0.0.0.0"
    wildfly_http_port: 8080
    wildfly_https_port: 8443
    wildfly_mgmt_port: 9990

    # Management user for CLI
    mgmt_user: "ansible"
    mgmt_password: "ChangeMe!Strong123"

    # EJBCA source (archive). You may pin a release tag (e.g., r9.1.1)
    ejbca_root: "/opt/ejbca"
    ejbca_ref: "main"
    ejbca_archive_url: "https://codeload.github.com/Keyfactor/ejbca-ce/tar.gz/refs/heads/{{ ejbca_ref }}"

    # MariaDB JDBC driver (deploy as a JAR; driver-name equals JAR name)
    mariadb_driver_version: "3.4.1"
    mariadb_driver_url: "https://repo1.maven.org/maven2/org/mariadb/jdbc/mariadb-java-client/{{ mariadb_driver_version }}/mariadb-java-client-{{ mariadb_driver_version }}.jar"
    mariadb_driver_jar: "mariadb-java-client-{{ mariadb_driver_version }}.jar"

    # ===== Database for EJBCA =====
    db_name: "ejbca"
    db_user: "ejbca"
    db_password: "ChangeMeStrong!"
    db_host: "127.0.0.1"
    db_port: 3306

    # ===== HTTPS (WildFly) =====
    wf_keystore_dir: "/opt/wildfly/standalone/configuration/keystore"
    wf_keystore_file: "{{ wf_keystore_dir }}/keystore.p12"
    wf_keystore_alias: "wildfly"
    wf_keystore_pass: "serverpwd"         # testing only; store securely later

    # ===== EJBCA settings =====
    # allow healthcheck from localhost + any (adjust for production)
    healthcheck_authorizedips: "127.0.0.1;ANY"

    # ===== Firewall (optional) =====
    ufw_enable: false

  pre_tasks:
    - name: Ensure Debian/Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.os_family == "Debian"
        fail_msg: "This play targets Ubuntu/Debian. Adjust for your OS."

  tasks:
    # -------------------- Base packages --------------------
    - name: Install base packages (Java, tools, DB server)
      ansible.builtin.apt:
        name:
          - "{{ java_pkg }}"
          - ca-certificates
          - unzip
          - curl
          - wget
          - ant
          - git
          - python3-pip
          - mariadb-server
          - python3-pymysql
          - tar
          - xz-utils
          - gzip
          - openssl
        state: present
        update_cache: yes

    - name: Ensure MariaDB is running
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes

    # -------------------- Database --------------------
    - name: Create EJBCA database
      community.mysql.mysql_db:
        login_host: "{{ db_host }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: "{{ db_name }}"
        state: present

    - name: Create EJBCA DB user
      community.mysql.mysql_user:
        login_host: "{{ db_host }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        state: present

    # -------------------- WildFly install/service --------------------
    - name: Create wildfly group
      ansible.builtin.group:
        name: "{{ wildfly_group }}"
        state: present

    - name: Create wildfly user
      ansible.builtin.user:
        name: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        create_home: no
        shell: /usr/sbin/nologin
        system: yes

    # Robust download with checksum to avoid corrupt/partial archives
    - name: Remove any stale WildFly tarball
      ansible.builtin.file:
        path: "/tmp/{{ wildfly_tarball }}"
        state: absent

    - name: Download WildFly tarball (GitHub Releases, with checksum)
      ansible.builtin.get_url:
        url: "{{ wildfly_url }}"
        dest: "/tmp/{{ wildfly_tarball }}"
        mode: "0644"
        timeout: 600
        force: true
        checksum: "sha256:{{ wildfly_sha256 }}"
        validate_certs: yes
      register: wildfly_dl
      retries: 3
      delay: 5
      until: wildfly_dl is succeeded

    - name: Extract WildFly under /opt
      ansible.builtin.unarchive:
        src: "/tmp/{{ wildfly_tarball }}"
        dest: "/opt"
        remote_src: yes
        creates: "/opt/wildfly-{{ wildfly_version }}"

    - name: Symlink {{ wildfly_home }} to current WildFly
      ansible.builtin.file:
        src: "/opt/wildfly-{{ wildfly_version }}"
        dest: "{{ wildfly_home }}"
        state: link
        force: true

    - name: Set ownership on WildFly directory
      ansible.builtin.file:
        path: "/opt/wildfly-{{ wildfly_version }}"
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        state: directory
        recurse: yes

    - name: Create WildFly systemd service
      ansible.builtin.copy:
        dest: /etc/systemd/system/wildfly.service
        mode: "0644"
        content: |
          [Unit]
          Description=WildFly Application Server
          After=network.target

          [Service]
          User={{ wildfly_user }}
          Group={{ wildfly_group }}
          LimitNOFILE=102642
          ExecStart={{ wildfly_home }}/bin/standalone.sh -b {{ wildfly_bind }} -bmanagement {{ wildfly_bind }}
          ExecStop={{ wildfly_home }}/bin/jboss-cli.sh --connect command=:shutdown
          Type=simple
          Restart=on-failure
          TimeoutStartSec=60
          TimeoutStopSec=60

          [Install]
          WantedBy=multi-user.target
      notify: Restart WildFly

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Ensure WildFly is started and enabled
      ansible.builtin.service:
        name: wildfly
        state: started
        enabled: yes

    - name: Wait for management port to be up
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ wildfly_mgmt_port }}"
        timeout: 120

    # -------------------- Management user --------------------
    - name: Stat mgmt user file
      ansible.builtin.stat:
        path: "{{ wildfly_home }}/standalone/configuration/mgmt-users.properties"
      register: mgmt_users_file

    - name: Remove any existing mgmt user line (prevent collisions)
      ansible.builtin.lineinfile:
        path: "{{ wildfly_home }}/standalone/configuration/mgmt-users.properties"
        regexp: "^{{ mgmt_user }}="
        state: absent
        create: yes
      when: mgmt_users_file.stat.exists

    - name: Stat mgmt groups file
      ansible.builtin.stat:
        path: "{{ wildfly_home }}/standalone/configuration/mgmt-groups.properties"
      register: mgmt_groups_file

    - name: Remove any existing mgmt group mapping for user
      ansible.builtin.lineinfile:
        path: "{{ wildfly_home }}/standalone/configuration/mgmt-groups.properties"
        regexp: "^{{ mgmt_user }}="
        state: absent
        create: yes
      when: mgmt_groups_file.stat.exists

    - name: Create WildFly management user (silent)
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/add-user.sh -u '{{ mgmt_user }}' -p '{{ mgmt_password }}' -s
      args: { executable: /bin/bash }

    - name: Ensure management user has SuperUser role
      ansible.builtin.lineinfile:
        path: "{{ wildfly_home }}/standalone/configuration/mgmt-groups.properties"
        line: "{{ mgmt_user }}=SuperUser"
        create: yes

    # -------------------- JDBC driver --------------------
    - name: Ensure deployments dir exists
      ansible.builtin.file:
        path: "{{ wildfly_home }}/standalone/deployments"
        state: directory
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        mode: "0755"

    - name: Download MariaDB JDBC driver into deployments
      ansible.builtin.get_url:
        url: "{{ mariadb_driver_url }}"
        dest: "{{ wildfly_home }}/standalone/deployments/{{ mariadb_driver_jar }}"
        mode: "0644"

    # -------------------- Datasource (remove → add → enable → test) ------------
    - name: Remove old EjbcaDS if present (ignore if missing)
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="/subsystem=datasources/data-source=ejbcads:remove"
      args: { executable: /bin/bash }
      failed_when: false
      changed_when: false

    - name: Add EjbcaDS
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="data-source add
          --name=ejbcads
          --jndi-name=java:/EjbcaDS
          --connection-url=jdbc:mariadb://{{ db_host }}:{{ db_port }}/{{ db_name }}
          --driver-name={{ mariadb_driver_jar }}
          --driver-class=org.mariadb.jdbc.Driver
          --user-name={{ db_user }}
          --password={{ db_password }}
          --min-pool-size=5 --max-pool-size=150
          --validate-on-match=true
          --background-validation=false
          --check-valid-connection-sql='select 1;'"
      args: { executable: /bin/bash }

    - name: Enable EjbcaDS
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="/subsystem=datasources/data-source=ejbcads:enable"
      args: { executable: /bin/bash }
      register: ds_enable
      failed_when: false

    - name: Test EjbcaDS connection
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="/subsystem=datasources/data-source=ejbcads:test-connection-in-pool"
      args: { executable: /bin/bash }
      register: dstest
      changed_when: false
      failed_when: dstest.rc != 0 and ((dstest.stdout | regex_search('success')) is none)

    # -------------------- EJBCA source (archive) --------------------
    - name: Ensure EJBCA root dir exists
      ansible.builtin.file:
        path: "{{ ejbca_root }}"
        state: directory
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        mode: "0755"

    - name: Clean EJBCA src dir (fresh)
      ansible.builtin.file:
        path: "{{ ejbca_root }}/src"
        state: absent

    - name: Recreate EJBCA src dir
      ansible.builtin.file:
        path: "{{ ejbca_root }}/src"
        state: directory
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        mode: "0755"

    - name: Download EJBCA CE source archive
      ansible.builtin.get_url:
        url: "{{ ejbca_archive_url }}"
        dest: "/tmp/ejbca-ce-{{ ejbca_ref }}.tar.gz"
        mode: "0644"
        timeout: 180
      register: ejbca_dl
      retries: 3
      delay: 5
      until: ejbca_dl is succeeded

    - name: Extract EJBCA CE into src (strip top-level folder)
      ansible.builtin.unarchive:
        src: "/tmp/ejbca-ce-{{ ejbca_ref }}.tar.gz"
        dest: "{{ ejbca_root }}/src"
        remote_src: yes
        extra_opts: ["--strip-components=1"]

    - name: Ensure EJBCA conf directory exists
      ansible.builtin.file:
        path: "{{ ejbca_root }}/src/conf"
        state: directory
        owner: "{{ wildfly_user }}"
        group: "{{ wildfly_group }}"
        mode: "0755"

    - name: Write EJBCA database.properties (MariaDB)
      ansible.builtin.copy:
        dest: "{{ ejbca_root }}/src/conf/database.properties"
        mode: "0644"
        content: |
          database.name=mysql
          database.url=jdbc:mariadb://{{ db_host }}:{{ db_port }}/{{ db_name }}
          database.driver=org.mariadb.jdbc.Driver
          database.username={{ db_user }}
          database.password={{ db_password }}
          database.maxIdle=10
          database.maxActive=100
          database.maxWait=10000

    - name: Write EJBCA ejbca.properties (minimal bootstrap)
      ansible.builtin.copy:
        dest: "{{ ejbca_root }}/src/conf/ejbca.properties"
        mode: "0644"
        content: |
          appserver.home={{ wildfly_home }}
          datasource.jndi=java:/EjbcaDS
          web.pub.http.port={{ wildfly_http_port }}
          web.pub.https.port={{ wildfly_https_port }}
          healthcheck.authorizedips={{ healthcheck_authorizedips }}

    # -------------------- Build (no auto-deploy) --------------------
    - name: Build EJBCA (produce dist/ejbca.ear)
      ansible.builtin.shell: |
        set -e
        export APPSRV_HOME="{{ wildfly_home }}"
        cd {{ ejbca_root }}/src
        ant -q clean build
      args: { executable: /bin/bash }
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
        PATH: "/usr/lib/jvm/java-17-openjdk-amd64/bin:{{ ansible_env.PATH }}"

    - name: Verify EJBCA EAR exists
      ansible.builtin.stat:
        path: "{{ ejbca_root }}/src/dist/ejbca.ear"
      register: ejbca_ear

    - name: Fail if EAR not built
      ansible.builtin.fail:
        msg: "ejbca.ear not found at {{ ejbca_root }}/src/dist/ejbca.ear"
      when: not ejbca_ear.stat.exists

    # -------------------- Clean & Deploy via WildFly CLI --------------------
    - name: Ensure no stale ejbca.ear deployment remains
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="/deployment=ejbca.ear:remove"
      args: { executable: /bin/bash }
      failed_when: false
      changed_when: false

    - name: Deploy fresh (enabled) with explicit names
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="deploy {{ ejbca_root }}/src/dist/ejbca.ear --name=ejbca.ear --runtime-name=ejbca.ear"
      args: { executable: /bin/bash }

    - name: Wait until ejbca.ear is ENABLED and OK
      ansible.builtin.shell: |
        set -e
        OUT="$({{ wildfly_home }}/bin/jboss-cli.sh -c \
          --controller=127.0.0.1:{{ wildfly_mgmt_port }} \
          --user='{{ mgmt_user }}' --password='{{ mgmt_password }}' \
          --commands='deployment-info')"
        echo "$OUT"
        # Expect a row like: "ejbca.ear  ejbca.ear  true  true  OK"
        echo "$OUT" | awk '$1=="ejbca.ear" && $4=="true" && $5=="OK"{f=1} END{exit(f?0:1)}'
      args: { executable: /bin/bash }
      register: depinfo
      changed_when: false
      retries: 20
      delay: 6
      until: depinfo.rc == 0

    # -------------------- Enable HTTPS listener on WildFly (Elytron/Undertow) ---
    - name: Create keystore dir
      ansible.builtin.file:
        path: "{{ wf_keystore_dir }}"
        state: directory
        mode: "0755"

    - name: Generate self-signed TLS cert & PKCS12 keystore (testing)
      ansible.builtin.shell: |
        set -e
        cd "{{ wf_keystore_dir }}"
        if [ ! -f server.crt ] || [ ! -f server.key ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
            -subj "/CN={{ ansible_fqdn | default(inventory_hostname) }}" \
            -keyout server.key -out server.crt
        fi
        if [ ! -f "{{ wf_keystore_file }}" ]; then
          openssl pkcs12 -export -in server.crt -inkey server.key \
            -out "{{ wf_keystore_file }}" -name "{{ wf_keystore_alias }}" \
            -passout pass:{{ wf_keystore_pass }}
        fi
      args: { executable: /bin/bash }

    - name: Configure interfaces, sockets, Elytron and HTTPS listener
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="
          if (outcome != success) of /interface=http:read-resource() then /interface=http:add(inet-address=0.0.0.0) end,
          if (outcome != success) of /interface=https:read-resource() then /interface=https:add(inet-address=0.0.0.0) end,
          if (outcome != success) of /socket-binding-group=standard-sockets/socket-binding=http:read-resource() then /socket-binding-group=standard-sockets/socket-binding=http:add(port={{ wildfly_http_port }},interface=http) end,
          if (outcome != success) of /socket-binding-group=standard-sockets/socket-binding=https:read-resource() then /socket-binding-group=standard-sockets/socket-binding=https:add(port={{ wildfly_https_port }},interface=https) end,
          if (outcome != success) of /subsystem=elytron/key-store=httpsKS:read-resource() then /subsystem=elytron/key-store=httpsKS:add(type=PKCS12, path=keystore/keystore.p12, relative-to=jboss.server.config.dir, credential-reference={{'{'}}clear-text={{ wf_keystore_pass }}{{'}'}}) end,
          if (outcome != success) of /subsystem=elytron/key-manager=httpsKM:read-resource() then /subsystem=elytron/key-manager=httpsKM:add(key-store=httpsKS, alias={{ wf_keystore_alias }}, credential-reference={{'{'}}clear-text={{ wf_keystore_pass }}{{'}'}}) end,
          if (outcome != success) of /subsystem=elytron/server-ssl-context=httpsSSC:read-resource() then /subsystem=elytron/server-ssl-context=httpsSSC:add(key-manager=httpsKM) end,
          if (outcome != success) of /subsystem=undertow/server=default-server/http-listener=http:read-resource() then /subsystem=undertow/server=default-server/http-listener=http:add(socket-binding=http, redirect-socket=https) end,
          if (outcome != success) of /subsystem=undertow/server=default-server/https-listener=https:read-resource() then /subsystem=undertow/server=default-server/https-listener=https:add(socket-binding=https, ssl-context=httpsSSC) end,
          :reload
        "
      args: { executable: /bin/bash }

    - name: Wait for HTTPS to listen
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ wildfly_https_port }}"
        timeout: 90

    # -------------------- Optional: datasource health (again) -----------------
    - name: Test EjbcaDS connection (post-deploy)
      ansible.builtin.shell: >
        {{ wildfly_home }}/bin/jboss-cli.sh -c
        --controller=127.0.0.1:{{ wildfly_mgmt_port }}
        --user='{{ mgmt_user }}' --password='{{ mgmt_password }}'
        --commands="/subsystem=datasources/data-source=ejbcads:test-connection-in-pool"
      args: { executable: /bin/bash }
      register: dstest2
      changed_when: false
      failed_when: dstest2.rc != 0 and ((dstest2.stdout | regex_search('success')) is none)

    # -------------------- Initialize CA (lab-friendly) --------------------
    - name: Initialize a Management CA (non-interactive)
      ansible.builtin.shell: |
        set -e
        export APPSRV_HOME="{{ wildfly_home }}"
        cd {{ ejbca_root }}/src
        bin/ejbca.sh ca init \
          --caname "ManagementCA" \
          --dn "CN=ManagementCA,O=Example,C=MA" \
          --tokenType soft \
          --tokenPass "changeit" \
          --superAdminCN "SuperAdmin"
      args: { executable: /bin/bash }
      register: ca_init
      changed_when: "'CA initialized' in ca_init.stdout or 'already exists' in ca_init.stdout"
      failed_when: false

    - name: Deploy RA Web (public UI)
      ansible.builtin.shell: |
        set -e
        export APPSRV_HOME="{{ wildfly_home }}"
        cd {{ ejbca_root }}/src
        bin/ejbca.sh raweb deploy
      args: { executable: /bin/bash }
      register: raweb
      changed_when: "'Deployed' in raweb.stdout"
      failed_when: false

    # -------------------- Firewall (optional) --------------------
    - name: Ensure UFW allows 8080/8443
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: ["{{ wildfly_http_port }}", "{{ wildfly_https_port }}"]
      when: ufw_enable

    # -------------------- Output useful URLs --------------------
    - name: Show URLs
      ansible.builtin.debug:
        msg:
          - "HTTP  UI:  http://{{ ansible_default_ipv4.address }}:{{ wildfly_http_port }}/ejbca/"
          - "HTTPS UI: https://{{ ansible_default_ipv4.address }}:{{ wildfly_https_port }}/ejbca/"
          - "AdminWeb: https://{{ ansible_default_ipv4.address }}:{{ wildfly_https_port }}/ejbca/adminweb (needs client cert)"
          - "Healthcheck: https://{{ ansible_default_ipv4.address }}:{{ wildfly_https_port }}/ejbca/publicweb/healthcheck/ejbcahealth (authorized IPs: {{ healthcheck_authorizedips }})"

  handlers:
    - name: Restart WildFly
      ansible.builtin.service:
        name: wildfly
        state: restarted
