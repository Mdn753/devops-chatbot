---
- name: Install EJBCA CE on VM (native install)
  hosts: all
  become: yes
  vars:
    ejbca_root: /opt/ejbca
    ejbca_repo: https://github.com/Keyfactor/ejbca-ce.git
    ejbca_ref: main   # can be a tag like v8.5.0
    wildfly_version: 30.0.0.Final
    wildfly_url: "https://github.com/wildfly/wildfly/releases/download/{{ wildfly_version }}/wildfly-{{ wildfly_version }}.tar.gz"
    db_name: ejbca
    db_user: ejbca
    db_password: ejbca_pass

  tasks:
    - name: Install required packages
      apt:
        name:
          - openjdk-17-jdk
          - unzip
          - mariadb-server
          - git
          - wget
        update_cache: yes

    - name: Ensure MariaDB is running
      service:
        name: mariadb
        state: started
        enabled: yes

    - name: Create EJBCA DB user and database
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
      register: db_created

    - name: Create DB user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        state: present

    - name: Create wildfly group
      group:
        name: wildfly
        state: present

    - name: Create wildfly user
      user:
        name: wildfly
        group: wildfly
        home: /opt/wildfly
        create_home: no
        shell: /bin/false

    - name: Download WildFly
      get_url:
        url: "{{ wildfly_url }}"
        dest: /tmp/wildfly.tar.gz
        mode: '0644'

    - name: Extract WildFly
      unarchive:
        src: /tmp/wildfly.tar.gz
        dest: /opt/
        remote_src: yes
      register: wildfly_extract

    - name: Symlink WildFly
      file:
        src: "/opt/wildfly-{{ wildfly_version }}"
        dest: /opt/wildfly
        state: link
        force: yes

    - name: Ensure EJBCA root exists
      file:
        path: "{{ ejbca_root }}"
        state: directory
        mode: '0755'

    - name: Remove existing non-git src dir
      file:
        path: "{{ ejbca_root }}/src"
        state: absent
      when: not lookup('ansible.builtin.stat', '{{ ejbca_root }}/src/.git').exists

    - name: Clone or update EJBCA CE
      git:
        repo: "{{ ejbca_repo }}"
        version: "{{ ejbca_ref }}"
        dest: "{{ ejbca_root }}/src"
        update: yes
        force: yes

    - name: Create EJBCA conf directory
      file:
        path: "{{ ejbca_root }}/src/conf"
        state: directory

    - name: Configure EJBCA database.properties
      copy:
        dest: "{{ ejbca_root }}/src/conf/database.properties"
        content: |
          database.name={{ db_name }}
          database.url=jdbc:mysql://localhost:3306/{{ db_name }}
          database.driver=org.mariadb.jdbc.Driver
          database.username={{ db_user }}
          database.password={{ db_password }}

    - name: Change ownership of EJBCA and WildFly
      file:
        path: "{{ item }}"
        owner: wildfly
        group: wildfly
        recurse: yes
      loop:
        - "{{ ejbca_root }}"
        - /opt/wildfly

    - name: Print final instructions
      debug:
        msg: |
          EJBCA CE installed.
          To initialize, run as wildfly user:
          cd {{ ejbca_root }}/src && ant clean deploy
