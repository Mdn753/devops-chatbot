---
- name: Deploy Python app on Raspberry Pi
  hosts: raspberry-vms
  become: true
  gather_facts: true

  vars:
    app_name: "myapp"
    app_repo: "https://github.com/you/your-app.git"
    app_branch: "main"
    app_entrypoint: "app.py"
    app_user: "myapp"
    app_dir: "/opt/{{ app_name }}"
    venv_dir: "{{ app_dir }}/venv"
    env_file: "/etc/{{ app_name }}/.env"
    expose_port: 0
    env_vars: {}

    # 🔐 optional: only needed for SSH repos like git@github.com:org/repo.git
    deploy_key: ""                              # put the PRIVATE key here via extra_vars
    deploy_key_path: "/etc/{{ app_name }}/deploy_key"
    # host extracted from repo to seed known_hosts when using SSH
    repo_host: "{{ (app_repo | regex_search('(?:@|://)([^/:]+)', '\\1')) | default('github.com') }}"

  pre_tasks:
    - name: Install base packages (Debian/Raspbian)
      ansible.builtin.apt:
        name:
          - git
          - python3
          - python3-venv
          - python3-pip
          - ufw
          - ca-certificates
          - openssh-client          # for ssh-keyscan / SSH transports
        state: present
        update_cache: yes

    - name: Create app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        create_home: false
        shell: /bin/bash            # must be a real shell for services

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default(app_user) }}"
        group: "{{ item.group | default(app_user) }}"
        mode: "{{ item.mode | default('0755') }}"
      loop:
        - { path: "{{ app_dir }}" }
        - { path: "/etc/{{ app_name }}", owner: "root", group: "root", mode: "0750" }
        - { path: "/var/log/{{ app_name }}" }

    # --- SSH repo helpers (safe to skip for HTTPS repos) ---
    - name: Add {{ repo_host }} host key (SSH repos)
      ansible.builtin.known_hosts:
        name: "{{ repo_host }}"
        key: "{{ lookup('pipe', 'ssh-keyscan -t rsa,ecdsa,ed25519 ' ~ repo_host ~ ' 2>/dev/null') }}"
        state: present
      when: app_repo is match('^(git@|ssh://)')

    - name: Install deploy key (if provided)
      ansible.builtin.copy:
        dest: "{{ deploy_key_path }}"
        owner: root
        group: root
        mode: "0600"
        content: "{{ deploy_key }}"
      when: deploy_key | length > 0

    # --- Fail fast if repo is unreachable (no interactive prompts) ---
    - name: Probe repo reachability (no prompts)
      ansible.builtin.command:
        cmd: git ls-remote --heads "{{ app_repo }}"
      environment:
        GIT_TERMINAL_PROMPT: "0"
        # use our deploy key if given (SSH only)
        GIT_SSH_COMMAND: >-
          {{ (deploy_key | length > 0)
             | ternary('ssh -i ' ~ deploy_key_path ~ ' -o StrictHostKeyChecking=accept-new', 'ssh -o StrictHostKeyChecking=accept-new') }}
      register: probe
      changed_when: false

  tasks:
    - name: Checkout/Update code (non-interactive)
      ansible.builtin.git:
        repo: "{{ app_repo }}"
        dest: "{{ app_dir }}/src"
        version: "{{ app_branch }}"
        force: true
        update: true
        single_branch: true
        depth: 1
        accept_hostkey: true
        key_file: "{{ (deploy_key | length > 0) | ternary(deploy_key_path, omit) }}"
      become_user: "{{ app_user }}"           # clone as the app user
      environment:
        GIT_TERMINAL_PROMPT: "0"
        GIT_SSH_COMMAND: >-
          {{ (deploy_key | length > 0)
             | ternary('ssh -i ' ~ deploy_key_path ~ ' -o StrictHostKeyChecking=accept-new', 'ssh -o StrictHostKeyChecking=accept-new') }}

    - name: Ensure venv exists and install requirements (if any)
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/src/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        virtualenv_command: "python3 -m venv"
      register: pip_result
      failed_when: false

    - name: Create .env from env_vars
      ansible.builtin.copy:
        dest: "{{ env_file }}"
        owner: root
        group: root
        mode: "0640"
        content: |
          {% for k, v in env_vars.items() %}
          {{ k }}={{ v }}
          {% endfor %}

    - name: Write systemd unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description={{ app_name }} service
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_user }}
          WorkingDirectory={{ app_dir }}/src
          EnvironmentFile=-{{ env_file }}
          ExecStart={{ venv_dir }}/bin/python {{ app_entrypoint }}
          Restart=on-failure
          RestartSec=3
          StandardOutput=append:/var/log/{{ app_name }}/stdout.log
          StandardError=append:/var/log/{{ app_name }}/stderr.log

          [Install]
          WantedBy=multi-user.target
      notify:
        - daemon-reload
        - restart app

    - name: Optionally open UFW port
      ansible.builtin.ufw:
        rule: allow
        port: "{{ expose_port }}"
        proto: tcp
      when: expose_port | int > 0

  handlers:
    - name: daemon-reload
      ansible.builtin.systemd:
        daemon_reload: true

    - name: restart app
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        state: restarted
        enabled: true
