---
- name: Install & configure Zabbix agent
  hosts: all
  become: true

  ####################################################################
  # PRE-TASK • discover the Zabbix server’s IP from inventory
  # (runs only once, on the control node)
  ####################################################################
  pre_tasks:
    - name: Resolve zbx_server_ip from inventory
      set_fact:
        # ── OPTION A • direct host (simplest) ───────────────────────
        # zbx_server_ip: "{{ hostvars['=vm-Zabbix'].ansible_host }}"

        # ── OPTION B • first host in group “Zabbix_server” ──────────
        zbx_server_ip: "{{ hostvars[ groups['Zabbix-server'][0] ].ansible_host }}"
      when: zbx_server_ip is not defined
      run_once: true
      delegate_to: localhost

  ####################################################################
  # TASKS
  ####################################################################
  tasks:
    - name: Install Zabbix agent package
      package:
        name: zabbix-agent
        state: present

    - name: Configure Zabbix agent for passive & active checks
      block:
        - name: Allow passive checks from the server
          lineinfile:
            path: /etc/zabbix/zabbix_agentd.conf
            regexp: '^Server='
            line: "Server={{ zbx_server_ip }}"

        - name: Send active checks back to the server
          lineinfile:
            path: /etc/zabbix/zabbix_agentd.conf
            regexp: '^ServerActive='
            line: "ServerActive={{ zbx_server_ip }}"

        - name: Listen on all interfaces (not just localhost)
          lineinfile:
            path: /etc/zabbix/zabbix_agentd.conf
            regexp: '^ListenIP='
            line: "ListenIP=0.0.0.0"
      notify: restart zabbix-agent

    - name: Enable and start the agent
      service:
        name: zabbix-agent
        state: started
        enabled: yes

  ####################################################################
  # HANDLERS
  ####################################################################
  handlers:
    - name: restart zabbix-agent
      service:
        name: zabbix-agent
        state: restarted
