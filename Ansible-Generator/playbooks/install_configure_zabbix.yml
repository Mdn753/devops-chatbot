---
# install_zabbix.yml ─ Ubuntu 18.04/20.04/22.04
# Works with Zabbix 6.0 LTS (default) or 7.0 stable
# ──────────────────────────────────────────────────────────────
# Example:
#   ansible-playbook install_zabbix.yml -e zabbix_version=7.0

- name: Install & configure Zabbix {{ zabbix_version }}
  hosts: Zabbix-server
  become: true
  gather_facts: true

########################################################################
# 0 • Parameters
########################################################################
  vars:
    zabbix_version:          "6.0"          # "6.0" LTS or "7.0" stable

    # Database credentials
    zabbix_db_name:          zabbix
    zabbix_db_user:          zabbix
    zabbix_db_password:      "StrongDBpass!"

    # UI login for first run
    zabbix_admin_password:   "zabbix"

    # PHP settings
    php_timezone:            "Africa/Casablanca"

    # Repo details
    zbx_keyring:             /usr/share/keyrings/zabbix.gpg
    zbx_series: >-
      {% set rel = ansible_distribution_release %}
      {{ rel if rel in ['jammy','focal','bionic'] else 'jammy' }}

    # MariaDB socket
    mysql_socket:            /var/run/mysqld/mysqld.sock

    # Correct SQL directory for the chosen major version
    zbx_sql_dir:             "/usr/share/zabbix-sql-scripts/mysql{{ zabbix_version }}"

########################################################################
# TASKS
########################################################################
  tasks:
  ######################################################################
  # 1 • OS packages + PyMySQL
  ######################################################################
  - name: Ensure base OS & PHP packages are present
    apt:
      name:
        - mariadb-server
        - libapache2-mod-php
        - php-mysql
        - php-bcmath
        - php-gd
        - php-xml
        - php-mbstring
        - php-ldap
        - php-curl
        - curl
        - gnupg
        - lsb-release
        - ca-certificates
        - python3-pymysql         # MySQL driver for Ansible
      state: present
      update_cache: yes

  ######################################################################
  # 2 • MariaDB: database & user
  ######################################################################
  - name: Create Zabbix database
    community.mysql.mysql_db:
      name: "{{ zabbix_db_name }}"
      state: present
      encoding: utf8mb4
      collation: utf8mb4_bin
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  - name: Create Zabbix DB user
    community.mysql.mysql_user:
      name: "{{ zabbix_db_user }}"
      host: localhost
      password: "{{ zabbix_db_password }}"
      priv: "{{ zabbix_db_name }}.*:ALL"
      state: present
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  ######################################################################
  # 3 • Add official Zabbix repo
  ######################################################################
  - name: Import Zabbix GPG key
    shell: |
      curl -fsSL https://repo.zabbix.com/zabbix-official-repo.key | \
      gpg --dearmor -o {{ zbx_keyring }}
    args: { creates: "{{ zbx_keyring }}" }

  - name: Add Zabbix APT repository
    apt_repository:
      repo: >-
        deb [arch=amd64 signed-by={{ zbx_keyring }}]
        https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu
        {{ zbx_series }} main
      filename: zabbix
      state: present
      update_cache: yes

  ######################################################################
  # 4 • Install Zabbix packages
  ######################################################################
  - name: Install Zabbix server, web frontend & agent
    apt:
      name:
        - zabbix-server-mysql
        - zabbix-frontend-php
        - zabbix-apache-conf
        - zabbix-sql-scripts
        - zabbix-agent
      state: present
      update_cache: yes

  ######################################################################
  # 5 • Import schema if DB is empty
  ######################################################################
  - name: Count current tables
    community.mysql.mysql_query:
      query: |
        SELECT COUNT(*) FROM information_schema.tables
        WHERE table_schema='{{ zabbix_db_name }}';
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"
    register: tablecount

  - name: Import Zabbix schema (first time only)
    when: (tablecount.query_result[0][0] | int) == 0
    block:
      - name: Import schema, images, data
        loop:
          - schema.sql.gz
          - images.sql.gz
          - data.sql.gz
        loop_control:
          loop_var: sqlfile
        mysql_db:
          name: "{{ zabbix_db_name }}"
          state: import
          target: "{{ zbx_sql_dir }}/{{ sqlfile }}"
          login_user: "{{ zabbix_db_user }}"
          login_password: "{{ zabbix_db_password }}"
          login_host: localhost

  ######################################################################
  # 6 • Configure server & PHP
  ######################################################################
  - name: Configure zabbix_server.conf
    lineinfile:
      path: /etc/zabbix/zabbix_server.conf
      regexp: "{{ item.regexp }}"
      line:   "{{ item.line }}"
    loop:
      - { regexp: '^DBHost=',       line: 'DBHost=localhost' }
      - { regexp: '^DBName=',       line: 'DBName={{ zabbix_db_name }}' }
      - { regexp: '^DBUser=',       line: 'DBUser={{ zabbix_db_user }}' }
      - { regexp: '^#?DBPassword=', line: 'DBPassword={{ zabbix_db_password }}' }
      - { regexp: '^#?PidFile=',    line: 'PidFile=/run/zabbix/zabbix_server.pid' }
    notify: restart zabbix-server

  - name: Set PHP timezone for frontend
    lineinfile:
      path: /etc/zabbix/apache.conf
      regexp: '^\s*#?\s*php_value date.timezone'
      line:  "        php_value date.timezone {{ php_timezone }}"
    notify: restart apache

  ######################################################################
  # 7 • Agent hostname
  ######################################################################
  - name: Ensure agent Hostname is clean
    blockinfile:
      path: /etc/zabbix/zabbix_agentd.conf
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        Hostname={{ inventory_hostname }}
    notify: restart zabbix-agent

  ######################################################################
  # 8 • Runtime directory (prevents PID-file crash)
  ######################################################################
  - name: Ensure /run/zabbix exists
    file:
      path: /run/zabbix
      state: directory
      owner: zabbix
      group: zabbix
      mode: "0755"

  ######################################################################
  # 9 • Start services and verify
  ######################################################################
  - name: Start and enable services
    systemd:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
      - mariadb
      - apache2
      - zabbix-server
      - zabbix-agent

  - name: Wait for Zabbix server port
    wait_for:
      host: 127.0.0.1
      port: 10051
      timeout: 90

  - name: Wait for Apache
    wait_for:
      host: 127.0.0.1
      port: 80
      timeout: 30

  ######################################################################
  # 10 • Summary
  ######################################################################
  - name: Show installation summary
    debug:
      msg: |
        ================================================
        Zabbix {{ zabbix_version }} installation complete! 🎉
        UI   : http://{{ ansible_default_ipv4.address }}/zabbix
        Login: Admin / {{ zabbix_admin_password }}
        DB   : {{ zabbix_db_name }} (user {{ zabbix_db_user }})
        ================================================

########################################################################
# HANDLERS
########################################################################
  handlers:
    - name: restart zabbix-server
      systemd: { name: zabbix-server, state: restarted }

    - name: restart zabbix-agent
      systemd: { name: zabbix-agent, state: restarted }

    - name: restart apache
      systemd: { name: apache2, state: restarted }
