---
# install_zabbix.yml ─ Ubuntu 18.04 | 20.04 | 22.04
# Installs Zabbix 6 LTS by default (set zabbix_version=7.0 for stable)

- name: Install & configure Zabbix {{ zabbix_version }}
  hosts: Zabbix-server
  become: true
  gather_facts: true

########################################################################
# 0 • Variables
########################################################################
  vars:
    zabbix_version:          "7.0"          # "6.0" LTS  or "7.0" stable
    zabbix_db_name:          zabbix
    zabbix_db_user:          zabbix
    zabbix_db_password:      "StrongDBpass!"
    zabbix_admin_password:   "zabbix"
    php_timezone:            "Africa/Casablanca"

    zbx_keyring:             /usr/share/keyrings/zabbix.gpg
    zbx_series: >-
      {% set rel = ansible_distribution_release %}
      {{ rel if rel in ['jammy','focal','bionic'] else 'jammy' }}

    mysql_socket:            /var/run/mysqld/mysqld.sock

########################################################################
# TASKS
########################################################################
  tasks:
  ######################################################################
  # 1 • OS packages + PyMySQL driver
  ######################################################################
  - name: Install system, PHP and MySQL driver packages
    apt:
      name:
        - mariadb-server
        - libapache2-mod-php
        - php-mysql
        - php-bcmath
        - php-gd
        - php-xml
        - php-mbstring
        - php-ldap
        - php-curl
        - curl
        - gnupg
        - lsb-release
        - ca-certificates
        - python3-pymysql
      state: present
      update_cache: yes

  ######################################################################
  # 2 • MariaDB database & user
  ######################################################################
  - name: Create Zabbix database
    community.mysql.mysql_db:
      name: "{{ zabbix_db_name }}"
      state: present
      encoding: utf8mb4
      collation: utf8mb4_bin
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  - name: Create Zabbix DB user
    community.mysql.mysql_user:
      name: "{{ zabbix_db_user }}"
      host: localhost
      password: "{{ zabbix_db_password }}"
      priv: "{{ zabbix_db_name }}.*:ALL"
      state: present
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  ######################################################################
  # 3 • Official Zabbix repo
  ######################################################################
  - name: Import Zabbix GPG key
    shell: >
      curl -fsSL https://repo.zabbix.com/zabbix-official-repo.key |
      gpg --dearmor -o {{ zbx_keyring }}
    args: { creates: "{{ zbx_keyring }}" }

  - name: Add Zabbix APT repository
    apt_repository:
      repo: >-
        deb [arch=amd64 signed-by={{ zbx_keyring }}]
        https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu
        {{ zbx_series }} main
      filename: zabbix
      state: present
      update_cache: yes

  ######################################################################
  # 4 • Install Zabbix packages
  ######################################################################
  - name: Install Zabbix server, frontend & agent
    apt:
      name:
        - zabbix-server-mysql
        - zabbix-frontend-php
        - zabbix-apache-conf
        - zabbix-sql-scripts
        - zabbix-agent
      state: present
      update_cache: yes

  ######################################################################
  # 5 • Locate SQL files directory (robust “find” version)
  ######################################################################
  - name: Locate schema.sql(.gz) on the host
    shell: |
      find /usr/share /usr/share/doc -type f \
           -path '*zabbix*sql*scripts*' \
           -name 'schema.sql*' -print -quit
    register: sql_schema_path
    changed_when: false
    failed_when: sql_schema_path.stdout == ""
    args:
      executable: /bin/bash

  - name: Save detected SQL directory
    set_fact:
      zbx_sql_dir: "{{ sql_schema_path.stdout | dirname }}"

  ######################################################################
  # 6 • Import schema if DB is empty
  ######################################################################
  - name: Count tables in database
    community.mysql.mysql_query:
      query: |
        SELECT COUNT(*) FROM information_schema.tables
        WHERE table_schema='{{ zabbix_db_name }}';
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"
    register: tablecount

  - name: Import Zabbix schema (first run only)
    when: (tablecount.query_result[0][0] | int) == 0
    loop:
      - schema.sql.gz
      - schema.sql              # fallback if files are uncompressed
      - images.sql.gz
      - images.sql
      - data.sql.gz
      - data.sql
    loop_control: { loop_var: sqlfile }
    vars:
      src_file: "{{ zbx_sql_dir }}/{{ sqlfile }}"
    when: "ansible.builtin.stat(path=src_file).stat.exists"
    block:
      - name: Import {{ sqlfile }}
        mysql_db:
          name: "{{ zabbix_db_name }}"
          state: import
          target: "{{ src_file }}"
          login_user: "{{ zabbix_db_user }}"
          login_password: "{{ zabbix_db_password }}"
          login_host: localhost

  ######################################################################
  # 7 • Configure server & PHP
  ######################################################################
  - name: Configure /etc/zabbix/zabbix_server.conf
    lineinfile:
      path: /etc/zabbix/zabbix_server.conf
      regexp: "{{ item.regexp }}"
      line:   "{{ item.line }}"
    loop:
      - { regexp: '^DBHost=',       line: 'DBHost=localhost' }
      - { regexp: '^DBName=',       line: 'DBName={{ zabbix_db_name }}' }
      - { regexp: '^DBUser=',       line: 'DBUser={{ zabbix_db_user }}' }
      - { regexp: '^#?DBPassword=', line: 'DBPassword={{ zabbix_db_password }}' }
      - { regexp: '^#?PidFile=',    line: 'PidFile=/run/zabbix/zabbix_server.pid' }
    notify: restart zabbix-server

  - name: Set PHP timezone
    lineinfile:
      path: /etc/zabbix/apache.conf
      regexp: '^\s*#?\s*php_value date.timezone'
      line:  "        php_value date.timezone {{ php_timezone }}"
    notify: restart apache

  ######################################################################
  # 8 • Runtime dir & agent hostname
  ######################################################################
  - name: Ensure /run/zabbix exists
    file:
      path: /run/zabbix
      state: directory
      owner: zabbix
      group: zabbix
      mode: "0755"

  - name: Set agent hostname
    lineinfile:
      path: /etc/zabbix/zabbix_agentd.conf
      regexp: '^Hostname='
      line: "Hostname={{ inventory_hostname }}"
    notify: restart zabbix-agent

  ######################################################################
  # 9 • Start services & verify ports
  ######################################################################
  - name: Enable and start services
    systemd:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop: [mariadb, apache2, zabbix-server, zabbix-agent]

  - name: Wait for Zabbix server port
    wait_for:
      host: 127.0.0.1
      port: 10051
      timeout: 90

  - name: Wait for Apache
    wait_for:
      host: 127.0.0.1
      port: 80
      timeout: 30

  ######################################################################
  # 10 • Summary
  ######################################################################
  - name: Installation summary
    debug:
      msg: |
        ================================================
        ✅ Zabbix {{ zabbix_version }} installed!
        UI   : http://{{ ansible_default_ipv4.address }}/zabbix
        Login: Admin / {{ zabbix_admin_password }}
        DB   : {{ zabbix_db_name }} (user {{ zabbix_db_user }})
        ================================================

########################################################################
# HANDLERS
########################################################################
  handlers:
    - name: restart zabbix-server
      systemd: { name: zabbix-server, state: restarted }

    - name: restart zabbix-agent
      systemd: { name: zabbix-agent, state: restarted }

    - name: restart apache
      systemd: { name: apache2, state: restarted }
