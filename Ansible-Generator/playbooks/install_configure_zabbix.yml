---
# zabbix_install.yml — Ubuntu 20.04/22.04  |  Zabbix 6.0 LTS (set zabbix_version to "7.0" for the stable line)

- name: Zabbix {{ zabbix_version }} LTS — manual installation
  hosts: Zabbix-server
  become: true
  gather_facts: true

########################################################################
# 0 • Parameters (override in inventory or --extra-vars)
########################################################################
  vars:
    zabbix_version:          "6.0"          # "6.0" LTS or "7.0" stable
    zabbix_db_name:          zabbix
    zabbix_db_user:          zabbix
    zabbix_db_password:      "StrongDBpass!"
    zabbix_admin_password:   "zabbix"
    php_timezone:            "Africa/Casablanca"

    # Repository settings
    zbx_keyring:             /usr/share/keyrings/zabbix.gpg
    zbx_series: >-
      {% set rel = ansible_distribution_release %}
      {{ rel if rel in ['jammy','focal','bionic'] else 'jammy' }}

    # MariaDB root via Unix socket (no password needed)
    mysql_socket:            /var/run/mysqld/mysqld.sock

########################################################################
# TASKS
########################################################################
  tasks:
  ######################################################################
  # 1 • Base packages + PyMySQL driver
  ######################################################################
  - name: Install system & PHP packages
    apt:
      name:
        - mariadb-server
        - libapache2-mod-php
        - php-mysql
        - php-bcmath
        - php-gd
        - php-xml
        - php-mbstring
        - php-ldap
        - php-curl
        - wget
        - curl
        - gnupg
        - lsb-release
        - ca-certificates
      state: present
      update_cache: yes

  - name: Install PyMySQL (MySQL driver for Ansible)
    apt:
      name: python3-pymysql
      state: present
      update_cache: yes

  ######################################################################
  # 2 • MariaDB: create DB & user
  ######################################################################
  - name: Ensure Zabbix database
    community.mysql.mysql_db:
      name: "{{ zabbix_db_name }}"
      state: present
      encoding: utf8mb4
      collation: utf8mb4_bin
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  - name: Ensure Zabbix DB user
    community.mysql.mysql_user:
      name: "{{ zabbix_db_user }}"
      host: localhost
      password: "{{ zabbix_db_password }}"
      priv: "{{ zabbix_db_name }}.*:ALL"
      state: present
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  ######################################################################
  # 3 • Add official Zabbix repo
  ######################################################################
  - name: Import Zabbix GPG key
    shell: |
      curl -fsSL https://repo.zabbix.com/zabbix-official-repo.key | \
      gpg --dearmor -o {{ zbx_keyring }}
    args: { creates: "{{ zbx_keyring }}" }

  - name: Add Zabbix APT repository
    apt_repository:
      repo: >-
        deb [arch=amd64 signed-by={{ zbx_keyring }}]
        https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu
        {{ zbx_series }} main
      filename: zabbix
      state: present
      update_cache: yes

  ######################################################################
  # 4 • Install Zabbix packages
  ######################################################################
  - name: Install Zabbix server, web frontend & agent
    apt:
      name:
        - zabbix-server-mysql
        - zabbix-frontend-php
        - zabbix-apache-conf
        - zabbix-sql-scripts
        - zabbix-agent
      state: present
      update_cache: yes

  ######################################################################
  # 5 • Import schema if DB is empty
  ######################################################################
  - name: Get table count (run as root via socket)
    community.mysql.mysql_info:
      filter: table_count
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"
      login_db: "{{ zabbix_db_name }}"
    register: dbinfo

  - name: Import Zabbix schema (first time only)
    when: dbinfo.table_count == 0
    shell: |
      for f in schema.sql.gz images.sql.gz data.sql.gz; do
        zcat /usr/share/zabbix-sql-scripts/mysql{{ zabbix_version }}/$f | \
        mysql --default-character-set=utf8mb4 \
              -u{{ zabbix_db_user }} -p{{ zabbix_db_password }} {{ zabbix_db_name }}
      done
    args: { executable: /bin/bash }

  ######################################################################
  # 6 • Configure zabbix_server.conf & PHP timezone
  ######################################################################
  - name: Configure Zabbix server DB parameters
    lineinfile:
      path: /etc/zabbix/zabbix_server.conf
      regexp: "{{ item.regexp }}"
      line:   "{{ item.line }}"
      backup: yes
    loop:
      - { regexp: '^DBHost=',       line: 'DBHost=localhost' }
      - { regexp: '^DBName=',       line: 'DBName={{ zabbix_db_name }}' }
      - { regexp: '^DBUser=',       line: 'DBUser={{ zabbix_db_user }}' }
      - { regexp: '^#?DBPassword=', line: 'DBPassword={{ zabbix_db_password }}' }
    notify: restart zabbix-server

  - name: Set PHP timezone
    lineinfile:
      path: /etc/zabbix/apache.conf
      regexp: '^\s*#?php_value date.timezone'
      line:  "        php_value date.timezone {{ php_timezone }}"
      backup: yes
    notify: restart apache

  ######################################################################
  # 7 • Agent hostname sanitisation
  ######################################################################
  - name: Derive clean agent Hostname
    set_fact:
      zbx_agent_hostname: >-
        {{
          (inventory_hostname
           | regex_replace('^[^A-Za-z0-9]+', '')
           | regex_replace('[^A-Za-z0-9._-]', '_')
          ) or 'localhost'
        }}

  - name: Ensure agent Hostname is clean
    blockinfile:
      path: /etc/zabbix/zabbix_agentd.conf
      create: false
      marker: "# {mark} ANSIBLE MANAGED BLOCK"
      block: |
        Hostname={{ zbx_agent_hostname }}
    notify: restart zabbix-agent

  ######################################################################
  # 8 • Config-check BEFORE first start
  ######################################################################
  - name: Validate zabbix_server.conf
    become_user: zabbix
    command: >
      zabbix_server --config-check -c /etc/zabbix/zabbix_server.conf
    register: cfgchk
    changed_when: false
    failed_when: "'configuration file is valid' not in cfgchk.stdout"

  ######################################################################
  # 9 • Enable & start services
  ######################################################################
  - name: Start and enable services
    systemd:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
      - zabbix-server
      - zabbix-agent
      - apache2

  - name: Ensure zabbix-server stayed running
    service_facts:

  - name: Fail fast if zabbix-server is not running
    fail:
      msg: "zabbix-server status: {{ ansible_facts.services['zabbix-server.service'].state }}"
    when: ansible_facts.services['zabbix-server.service'].state != 'running'

  ######################################################################
  # 10 • Wait for open ports
  ######################################################################
  - name: Wait for Zabbix server port
    wait_for:
      host: "{{ ansible_default_ipv4.address }}"
      port: 10051
      timeout: 30

  - name: Wait for Apache
    wait_for:
      host: "{{ ansible_default_ipv4.address }}"
      port: 80
      timeout: 30

  ######################################################################
  # 11 • Finish banner
  ######################################################################
  - name: Show installation summary
    debug:
      msg: |
        ================================================
        Zabbix {{ zabbix_version }} installation complete!
        UI   : http://{{ ansible_default_ipv4.address }}/zabbix
        Login: Admin / {{ zabbix_admin_password }}
        DB   : {{ zabbix_db_name }} (user {{ zabbix_db_user }})
        Services zabbix-server, zabbix-agent, apache2 are enabled.
        ================================================

########################################################################
# HANDLERS
########################################################################
  handlers:
    - name: restart zabbix-server
      systemd: { name: zabbix-server, state: restarted }

    - name: restart zabbix-agent
      systemd: { name: zabbix-agent, state: restarted }

    - name: restart apache
      systemd: { name: apache2, state: restarted }
