---
# install_zabbix_final.yml — Ubuntu 18.04 • 20.04 • 22.04 • 24.04
# Installs Zabbix 7.0 by default. Override: -e zabbix_version=6.0

- name: Install & configure Zabbix {{ zabbix_version }}
  hosts: Zabbix-server
  become: true
  gather_facts: true

########################################################################
# 0 · Variables
########################################################################
  vars:
    zabbix_version:          "7.0"          # "6.0" LTS or "7.0" stable
    zabbix_db_name:          zabbix
    zabbix_db_user:          zabbix
    zabbix_db_password:      "StrongDBpass!"
    zabbix_admin_password:   "zabbix"
    php_timezone:            "Africa/Casablanca"

    zbx_keyring:             /usr/share/keyrings/zabbix.gpg
    # Determine compatible Ubuntu codename for Zabbix repo
    zbx_ubuntu_codename: >-
      {{
        'jammy' if ansible_distribution_release in ['noble', 'plucky'] else
        ( ansible_distribution_release if ansible_distribution_release in ['jammy', 'focal', 'bionic'] else 'jammy' )
      }}

    mysql_socket:            /var/run/mysqld/mysqld.sock

########################################################################
# TASKS
########################################################################
  tasks:
  ######################################################################
  # 1 · Required packages
  ######################################################################
  - name: Install base OS & PHP packages
    apt:
      name:
        - mariadb-server
        - libapache2-mod-php
        - php-mysql
        - php-bcmath
        - php-gd
        - php-xml
        - php-mbstring
        - php-ldap
        - php-curl
        - curl
        - gnupg
        - lsb-release
        - ca-certificates
        - python3-pymysql
        - python3-mysqldb # Ensure MySQLdb Python module is available
      state: present
      update_cache: yes

  ######################################################################
  # 2 · MariaDB database & user
  ######################################################################
  - name: Ensure MariaDB service is started and enabled
    systemd:
      name: mariadb
      state: started
      enabled: yes

  - name: Wait for MariaDB port 3306 to be available
    wait_for:
      host: localhost
      port: 3306
      state: started
      timeout: 30

  - name: Create Zabbix database
    community.mysql.mysql_db:
      name: "{{ zabbix_db_name }}"
      state: present
      encoding: utf8mb4
      collation: utf8mb4_bin
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  - name: Create Zabbix DB user
    community.mysql.mysql_user:
      name: "{{ zabbix_db_user }}"
      host: localhost
      password: "{{ zabbix_db_password }}"
      priv: "{{ zabbix_db_name }}.*:ALL"
      state: present
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"

  ######################################################################
  # 3 · Zabbix repository (CORRECTED FOR 24.04/Noble)
  ######################################################################
  - name: Import Zabbix GPG key
    shell: |
      curl -fsSL https://repo.zabbix.com/zabbix-official-repo.key | gpg --dearmor > {{ zbx_keyring }}
    args:
      creates: "{{ zbx_keyring }}"

  - name: Debug Zabbix repository variables (Optional)
    debug:
      msg: "Zabbix Version: {{ zabbix_version }}, Detected OS Release: {{ ansible_distribution_release }}, Using Repo Codename: {{ zbx_ubuntu_codename }}"

  - name: Add Zabbix APT repository
    apt_repository:
      repo: "deb [signed-by={{ zbx_keyring }}] https://repo.zabbix.com/zabbix/{{ zabbix_version }}/ubuntu {{ zbx_ubuntu_codename }} main"
      filename: zabbix
      state: present

  - name: Update apt cache after adding Zabbix repository
    apt:
      update_cache: yes
    retries: 3
    delay: 5
    register: apt_update_result
    until: apt_update_result is succeeded

  ######################################################################
  # 4 · Install Zabbix packages
  ######################################################################
  - name: Install Zabbix server, frontend & agent
    apt:
      name:
        - zabbix-server-mysql
        - zabbix-frontend-php
        - zabbix-apache-conf
        - zabbix-sql-scripts
        - zabbix-agent
      state: present
      update_cache: yes

  ######################################################################
  # 5 · Locate SQL scripts directory & Import schema
  ######################################################################
  - name: Locate schema.sql(.gz)
    shell: |
      set -o pipefail
      find /usr/share /usr/share/doc -type f -path '*zabbix*sql*' \
           -name 'schema.sql*' -print -quit
    register: sql_schema_path
    changed_when: false
    failed_when: sql_schema_path.stdout == ""
    args: { executable: /bin/bash }

  - name: Set SQL directory fact
    set_fact:
      zbx_sql_dir: "{{ sql_schema_path.stdout | dirname }}"

  - name: Count tables in Zabbix database
    community.mysql.mysql_query:
      query: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='{{ zabbix_db_name }}';
      login_user: root
      login_unix_socket: "{{ mysql_socket }}"
    register: tablecount

  - name: Import Zabbix SQL schema, images, and data if database is empty
    when: tablecount.query_result[0][0]|int == 0
    block:
      # --- Decompress and Import Schema ---
      - name: Check if schema.sql.gz exists
        stat:
          path: "{{ zbx_sql_dir }}/schema.sql.gz"
        register: schema_gz_stat

      - name: Decompress schema.sql.gz if it exists
        command: gunzip -k {{ zbx_sql_dir }}/schema.sql.gz
        when: schema_gz_stat.stat.exists

      - name: Determine schema.sql path (compressed or not)
        set_fact:
          schema_sql_path: "{{ zbx_sql_dir }}/schema.sql"

      - name: Import schema.sql
        community.mysql.mysql_db:
          name: "{{ zabbix_db_name }}"
          state: import
          target: "{{ schema_sql_path }}"
          login_user: "{{ zabbix_db_user }}"
          login_password: "{{ zabbix_db_password }}"
          login_unix_socket: "{{ mysql_socket }}"

      # --- Decompress and Import Images ---
      - name: Check if images.sql.gz exists
        stat:
          path: "{{ zbx_sql_dir }}/images.sql.gz"
        register: images_gz_stat

      - name: Decompress images.sql.gz if it exists
        command: gunzip -k {{ zbx_sql_dir }}/images.sql.gz
        when: images_gz_stat.stat.exists

      - name: Determine images.sql path (compressed or not)
        set_fact:
          images_sql_path: "{{ zbx_sql_dir }}/images.sql"
        when: images_gz_stat.stat.exists or (zbx_sql_dir + '/images.sql') is file

      - name: Import images.sql (if exists)
        community.mysql.mysql_db:
          name: "{{ zabbix_db_name }}"
          state: import
          target: "{{ images_sql_path }}"
          login_user: "{{ zabbix_db_user }}"
          login_password: "{{ zabbix_db_password }}"
          login_unix_socket: "{{ mysql_socket }}"
        when: (images_gz_stat.stat.exists or (zbx_sql_dir + '/images.sql') is file) and (images_gz_stat.stat.exists or (zbx_sql_dir + '/images.sql') is file) # Redundant check removed in logic

      # --- Decompress and Import Data ---
      - name: Check if data.sql.gz exists
        stat:
          path: "{{ zbx_sql_dir }}/data.sql.gz"
        register: data_gz_stat

      - name: Decompress data.sql.gz if it exists
        command: gunzip -k {{ zbx_sql_dir }}/data.sql.gz
        when: data_gz_stat.stat.exists

      - name: Determine data.sql path (compressed or not)
        set_fact:
          data_sql_path: "{{ zbx_sql_dir }}/data.sql"
        when: data_gz_stat.stat.exists or (zbx_sql_dir + '/data.sql') is file

      - name: Import data.sql (if exists)
        community.mysql.mysql_db:
          name: "{{ zabbix_db_name }}"
          state: import
          target: "{{ data_sql_path }}"
          login_user: "{{ zabbix_db_user }}"
          login_password: "{{ zabbix_db_password }}"
          login_unix_socket: "{{ mysql_socket }}"
        when: data_gz_stat.stat.exists or (zbx_sql_dir + '/data.sql') is file

  ######################################################################
  # 6 · Configure server & PHP
  ######################################################################
  - name: Configure zabbix_server.conf
    lineinfile:
      path: /etc/zabbix/zabbix_server.conf
      regexp: "{{ item.regexp }}"
      line:   "{{ item.line }}"
    loop:
      - { regexp: '^DBHost=',       line: 'DBHost=localhost' }
      - { regexp: '^DBName=',       line: 'DBName={{ zabbix_db_name }}' }
      - { regexp: '^DBUser=',       line: 'DBUser={{ zabbix_db_user }}' }
      - { regexp: '^#?DBPassword=', line: 'DBPassword={{ zabbix_db_password }}' }
      - { regexp: '^#?PidFile=',    line: 'PidFile=/run/zabbix/zabbix_server.pid' }
    notify: restart zabbix-server

  - name: Configure PHP timezone
    lineinfile:
      path: /etc/zabbix/apache.conf
      regexp: '^\s*#?\s*php_value date.timezone'
      line:  "        php_value date.timezone {{ php_timezone }}"
    notify: restart apache

  ######################################################################
  # 7 · Runtime dir & agent Hostname
  ######################################################################
  - name: Create Zabbix runtime directory
    file:
      path: /run/zabbix
      state: directory
      owner: zabbix
      group: zabbix
      mode: '0755'

  - name: Configure Zabbix agent hostname
    lineinfile:
      path: /etc/zabbix/zabbix_agentd.conf
      regexp: '^Hostname='
      line: "Hostname={{ inventory_hostname }}"
    notify: restart zabbix-agent

  ######################################################################
  # 8 · Flush handlers to apply config changes
  ######################################################################
  - name: Flush handlers to restart services if config changed
    meta: flush_handlers

  ######################################################################
  # 9 · Start services explicitly
  ######################################################################
  # Ensure services are started *after* potential restarts from handlers
  - name: Ensure required services are started and enabled
    systemd:
      name: "{{ item }}"
      state: started
      enabled: yes
    loop:
      - mariadb
      - apache2
      - zabbix-server # Explicitly start after config & DB
      - zabbix-agent

  ######################################################################
  # 10 · Health-checks
  ######################################################################
  - name: Pause to allow services to stabilize
    pause:
      seconds: 20

  - name: Check zabbix-server unit state
    shell: systemctl is-active zabbix-server
    register: zbx_state
    changed_when: false
    failed_when: false # ← ignore non-zero RC initially

  - name: Show logs and fail if not running
    when: zbx_state.stdout != "active"
    block:
      - name: Get recent zabbix-server logs
        shell: journalctl -u zabbix-server -n 20 --no-pager
        register: zbx_logs
        changed_when: false
      - name: Display zabbix-server failure logs
        debug:
          msg: |
            ❌ zabbix-server service is {{ zbx_state.stdout }}.
            Last 20 log lines:
            {{ zbx_logs.stdout }}
      - name: Fail the playbook due to zabbix-server startup failure
        fail:
          msg: "zabbix-server failed to start. See logs above."

  - name: Detect bind address of port 10051
    when: zbx_state.stdout == "active"
    shell: ss -ltnH '( sport = :10051 )' | awk '{print $4}' | head -n1
    register: zbx_bind
    changed_when: false

  - name: Wait for Zabbix server to bind to port 10051
    when: zbx_state.stdout == "active"
    wait_for:
      host: "{{ zbx_bind.stdout | default('127.0.0.1') }}"
      port: 10051
      timeout: 180

  ######################################################################
  # 11 · Summary
  ######################################################################
  - name: Display Installation Success Summary
    debug:
      msg: |
        ================================================
        ✅ Zabbix {{ zabbix_version }} installed!
        UI   : http://{{ ansible_default_ipv4.address }}/zabbix
        Login: Admin / {{ zabbix_admin_password }}
        DB   : {{ zabbix_db_name }} (user {{ zabbix_db_user }})
        ================================================

########################################################################
# HANDLERS (Flushed explicitly)
########################################################################
# Handlers are triggered by 'notify' and flushed by 'meta: flush_handlers'
# This ensures services are restarted *before* the explicit start tasks.
  handlers:
    - name: restart zabbix-server
      systemd:
        name: zabbix-server
        state: restarted

    - name: restart zabbix-agent
      systemd:
        name: zabbix-agent
        state: restarted

    - name: restart apache
      systemd:
        name: apache2
        state: restarted
