---
- name: Install and configure GNS3-server with uBridge/Dynamips/VPCS (container-built)
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  vars:
    gns3_host:  "0.0.0.0"
    gns3_port:  3080
    gns3_user:  gns3
    gns3_version: "2.2.54"
    build_image: "ubuntu:22.04"

  tasks:
    ####################################################################
    # 0) PREP & MINIMAL HOST DEPS
    ####################################################################
    - name: Stop unattended-upgrades if present (avoid apt locks)
      systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base host packages (no libvirt/dev toolchains)
      apt:
        name:
          - wget
          - curl
          - qemu-kvm
          - qemu-utils
          - bridge-utils
          - git
          - build-essential
          - python3
          - python3-pip
          - libcap2-bin             # provides setcap
          - ca-certificates
        state: present

    ####################################################################
    # 1) PYTHON VENV + GNS3 SERVER (HOST)
    ####################################################################
    - name: Ensure pip works
      command: python3 -m pip --version

    - name: Install/upgrade virtualenv via pip (allow system pip per PEP 668)
      command: python3 -m pip install --upgrade virtualenv
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: Create Python virtualenv for GNS3 (via virtualenv, not python3-venv)
      command: python3 -m virtualenv /opt/gns3/venv
      args:
        creates: /opt/gns3/venv/bin/python

    - name: Upgrade pip/setuptools/wheel inside venv
      command: /opt/gns3/venv/bin/pip install --upgrade pip setuptools wheel

    - name: Install gns3-server in venv (pinned)
      command: /opt/gns3/venv/bin/pip install gns3-server=={{ gns3_version }}

    ####################################################################
    # 2) BUILD uBRIDGE / DYNAMIPS / VPCS INSIDE DOCKER, COPY TO HOST
    ####################################################################
    - name: Install Docker engine on host
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create build output directory on host
      file:
        path: /opt/gns3/build-out
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Pull builder image
      command: docker pull {{ build_image }}

    - name: Build uBridge/Dynamips/VPCS in clean container and copy out
      shell: >
        docker run --rm
        -v /opt/gns3/build-out:/out
        {{ build_image }} bash -lc '
          set -euo pipefail;
          export DEBIAN_FRONTEND=noninteractive;
          apt-get update;
          apt-get install -y --no-install-recommends git build-essential cmake make gcc g++ autoconf automake libtool libpcap-dev libelf-dev ca-certificates pkg-config;
          # uBridge
          cd /tmp && git clone https://github.com/GNS3/ubridge.git;
          cd /tmp/ubridge && (make clean || true) && make;
          install -m 0755 ubridge /out/ubridge;
          # Dynamips
          cd /tmp && git clone https://github.com/GNS3/dynamips.git;
          cd /tmp/dynamips && mkdir -p build && cd build && cmake .. && make;
          install -m 0755 dynamips /out/dynamips;
          # VPCS
          cd /tmp && git clone https://github.com/GNS3/vpcs.git;
          cd /tmp/vpcs;
          if [ -f configure ]; then ./configure && make; \
          elif [ -f autogen.sh ]; then ./autogen.sh && ./configure && make; \
          else cd src && make -f Makefile.linux && cd ..; fi;
          if [ -f vpcs ]; then install -m 0755 vpcs /out/vpcs; \
          else install -m 0755 src/vpcs /out/vpcs; fi
        '


    - name: Install built binaries to host
      copy:
        src: "/opt/gns3/build-out/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - ubridge
        - dynamips
        - vpcs

    - name: Grant ubridge raw socket/net admin capabilities (no root runs)
      shell: "setcap cap_net_admin,cap_net_raw+eip /usr/local/bin/ubridge"
      args:
        warn: false
      failed_when: false

    ####################################################################
    # 3) USER / DIRS / CONFIG
    ####################################################################
    - name: Create service user
      user:
        name:  "{{ gns3_user }}"
        system: yes
        create_home: yes
        home: /opt/gns3
        shell: /usr/sbin/nologin
        groups: kvm

    - name: Create GNS3 directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: "0755"
      loop:
        - /etc/gns3
        - /opt/gns3
        - /opt/gns3/images
        - /opt/gns3/projects
        - /var/log/gns3

    - name: Deploy gns3_server.conf
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode:  "0644"
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          cors = True
          console_start_port_range = 5000
          console_end_port_range   = 5010
          images_path   = /opt/gns3/images
          projects_path = /opt/gns3/projects

          [Qemu]
          enable_kvm  = True
          require_kvm = False
      notify: restart gns3

    ####################################################################
    # 4) SYSTEMD SERVICE (run venv binary)
    ####################################################################
    - name: Ensure gns3server binary exists in venv
      stat:
        path: /opt/gns3/venv/bin/gns3server
      register: venv_srv

    - name: Abort if venv gns3server not found
      fail:
        msg: "Expected /opt/gns3/venv/bin/gns3server but it was not found."
      when: not venv_srv.stat.exists

    - name: Deploy gns3.service
      copy:
        dest: /etc/systemd/system/gns3.service
        mode: "0644"
        content: |
          [Unit]
          Description=GNS3 Server (venv)
          After=network.target docker.service

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          WorkingDirectory=/opt/gns3
          ExecStart=/opt/gns3/venv/bin/gns3server \
                    --config /etc/gns3/gns3_server.conf \
                    --local \
                    --log /var/log/gns3/gns3.log
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - reload systemd
        - restart gns3

    - name: Enable & start gns3.service
      systemd:
        name: gns3
        enabled: yes
        state: started
        daemon_reload: yes

    ####################################################################
    # 5) FIREWALL
    ####################################################################
    - name: Check if UFW is active
      shell: "ufw status | grep -q 'Status: active'"
      register: ufw_active
      failed_when: false
      changed_when: false

    - name: Open GNS3 TCP ports (if UFW active)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ gns3_port }}"
        - "5000:5010"
      when: ufw_active.rc == 0

    ####################################################################
    # 6) VERIFY API
    ####################################################################
    - name: Wait until the API responds
      uri:
        url: "http://localhost:{{ gns3_port }}/v2/version"
        method: GET
      register: api_test
      retries: 8
      delay: 2
      until: api_test.status == 200

    - name: Print connection details
      debug:
        msg: |
          ================================
          GNS3 Server Installation Complete
          ================================
          REST API : http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}
          Test     : curl http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}/v2/version
          Binaries : /usr/local/bin/ubridge, /usr/local/bin/dynamips, /usr/local/bin/vpcs
          Logs     : journalctl -u gns3 -f

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart gns3
      systemd:
        name: gns3
        state: restarted
