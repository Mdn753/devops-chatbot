---
- name: Install and configure GNS3-server + build uBridge/Dynamips/VPCS (no Docker)
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  vars:
    gns3_host: "0.0.0.0"
    gns3_port: 3080
    gns3_user: gns3
    gns3_version: "2.2.54"            # stable 2.x
    libpcap_ver: "1.10.4"             # libpcap to build from source

  tasks:
    ####################################################################
    # 0) PREP & MINIMAL HOST DEPS
    ####################################################################
    - name: Stop unattended-upgrades if present (avoid apt locks)
      systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install base runtime & build tools (no fragile dev chains)
      apt:
        name:
          - wget
          - curl
          - ca-certificates
          - git
          - build-essential
          - pkg-config
          - libelf-dev                  # needed by Dynamips
          - qemu-kvm
          - qemu-utils
          - bridge-utils
          - python3
          - python3-pip
          - libcap2-bin                 # setcap for ubridge
        state: present

    ####################################################################
    # 1) PYTHON VENV + GNS3 SERVER (HOST)
    ####################################################################
    - name: Ensure pip works
      command: python3 -m pip --version

    - name: Install/upgrade virtualenv via pip (allow system pip per PEP 668)
      command: python3 -m pip install --upgrade virtualenv
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

    - name: Create Python virtualenv for GNS3
      command: python3 -m virtualenv /opt/gns3/venv
      args:
        creates: /opt/gns3/venv/bin/python

    - name: Upgrade pip/setuptools/wheel inside venv
      command: /opt/gns3/venv/bin/pip install --upgrade pip setuptools wheel

    - name: Install gns3-server in venv (pinned)
      command: /opt/gns3/venv/bin/pip install gns3-server=={{ gns3_version }}

    - name: Install CMake inside venv (avoid apt cmake)
      command: /opt/gns3/venv/bin/pip install cmake

    ####################################################################
    # 2) BUILD LIBPCAP FROM SOURCE  (to avoid libpcap-dev apt conflicts)
    ####################################################################
    - name: Download libpcap source tarball
      get_url:
        url: "https://www.tcpdump.org/release/libpcap-{{ libpcap_ver }}.tar.gz"
        dest: "/tmp/libpcap-{{ libpcap_ver }}.tar.gz"
        mode: "0644"
      register: libpcap_tar
      ignore_errors: yes

    - name: Fallback – clone libpcap from Git if tarball fetch failed
      git:
        repo: "https://github.com/the-tcpdump-group/libpcap.git"
        dest: "/tmp/libpcap-git"
        version: master
        depth: 1
      when: libpcap_tar is failed

    - name: Extract libpcap tarball
      unarchive:
        src: "/tmp/libpcap-{{ libpcap_ver }}.tar.gz"
        dest: /tmp
        remote_src: yes
      when: libpcap_tar is succeeded

    - name: Build & install libpcap (from tarball)
      shell: |
        cd /tmp/libpcap-{{ libpcap_ver }}
        ./configure
        make -j"$(nproc)"
        make install
        ldconfig
      args:
        warn: false
      when: libpcap_tar is succeeded

    - name: Build & install libpcap (from git, autogen if needed)
      shell: |
        set -e
        cd /tmp/libpcap-git
        if [ -f ./configure ]; then
          ./configure
        elif [ -f ./autogen.sh ]; then
          ./autogen.sh && ./configure
        else
          ./configure || true
        fi
        make -j"$(nproc)"
        make install
        ldconfig
      args:
        warn: false
      when: libpcap_tar is failed

    ####################################################################
    # 3) BUILD uBRIDGE / DYNAMIPS / VPCS  (ON HOST)
    ####################################################################
    - name: Build and install uBridge (uses libpcap from /usr/local)
      shell: |
        set -e
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
        cd /tmp
        rm -rf ubridge
        git clone https://github.com/GNS3/ubridge.git
        cd ubridge
        make clean || true
        make -j"$(nproc)"
        install -m 0755 ubridge /usr/local/bin/ubridge
      args:
        warn: false

    - name: Build and install Dynamips (use cmake from venv)
      shell: |
        set -e
        cd /tmp
        rm -rf dynamips
        git clone https://github.com/GNS3/dynamips.git
        cd dynamips
        rm -rf build && mkdir build && cd build
        /opt/gns3/venv/bin/cmake ..
        make -j"$(nproc)"
        install -m 0755 dynamips /usr/local/bin/dynamips
      args:
        warn: false

    - name: Build and install VPCS (prefer Makefile.linux to avoid autotools)
      shell: |
        set -e
        cd /tmp
        rm -rf vpcs
        git clone https://github.com/GNS3/vpcs.git
        if [ -f vpcs/src/Makefile.linux ]; then
          cd vpcs/src && make -f Makefile.linux -j"$(nproc)"
          install -m 0755 vpcs /usr/local/bin/vpcs
        else
          cd vpcs
          if [ -f configure ]; then ./configure && make -j"$(nproc)"; \
          elif [ -f autogen.sh ]; then ./autogen.sh && ./configure && make -j"$(nproc)"; \
          else cd src && make -f Makefile.linux -j"$(nproc)"; fi
          if [ -f vpcs ]; then install -m 0755 vpcs /usr/local/bin/vpcs; \
          elif [ -f src/vpcs ]; then install -m 0755 src/vpcs /usr/local/bin/vpcs; fi
        fi
      args:
        warn: false

    - name: Grant ubridge raw socket/net admin capabilities (so non-root can capture/bridge)
      shell: "setcap cap_net_admin,cap_net_raw+eip /usr/local/bin/ubridge"
      args:
        warn: false
      failed_when: false

    ####################################################################
    # 4) USER / DIRS / CONFIG
    ####################################################################
    - name: Create service user
      user:
        name: "{{ gns3_user }}"
        system: yes
        create_home: yes
        home: /opt/gns3
        shell: /usr/sbin/nologin
        groups: kvm

    - name: Create GNS3 directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: "0755"
      loop:
        - /etc/gns3
        - /opt/gns3
        - /opt/gns3/images
        - /opt/gns3/projects
        - /var/log/gns3

    - name: Deploy gns3_server.conf
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: "0644"
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          cors = True
          console_start_port_range = 5000
          console_end_port_range   = 5010
          images_path   = /opt/gns3/images
          projects_path = /opt/gns3/projects

          [Qemu]
          enable_kvm  = True
          require_kvm = False
      notify: restart gns3

    ####################################################################
    # 5) SYSTEMD SERVICE (run venv binary)
    ####################################################################
    - name: Ensure gns3server binary exists in venv
      stat:
        path: /opt/gns3/venv/bin/gns3server
      register: venv_srv

    - name: Abort if venv gns3server not found
      fail:
        msg: "Expected /opt/gns3/venv/bin/gns3server but it was not found."
      when: not venv_srv.stat.exists

    - name: Deploy gns3.service
      copy:
        dest: /etc/systemd/system/gns3.service
        mode: "0644"
        content: |
          [Unit]
          Description=GNS3 Server (venv)
          After=network.target

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          WorkingDirectory=/opt/gns3
          ExecStart=/opt/gns3/venv/bin/gns3server \
                    --config /etc/gns3/gns3_server.conf \
                    --local \
                    --log /var/log/gns3/gns3.log
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - reload systemd
        - restart gns3

    - name: Enable & start gns3.service
      systemd:
        name: gns3
        enabled: yes
        state: started
        daemon_reload: yes

    ####################################################################
    # 6) FIREWALL
    ####################################################################
    - name: Check if UFW is active
      shell: "ufw status | grep -q 'Status: active'"
      register: ufw_active
      failed_when: false
      changed_when: false

    - name: Open GNS3 TCP ports (if UFW active)
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ gns3_port }}"
        - "5000:5010"
      when: ufw_active.rc == 0

    ####################################################################
    # 7) VERIFY API
    ####################################################################
    - name: Wait until the API responds
      uri:
        url: "http://localhost:{{ gns3_port }}/v2/version"
        method: GET
      register: api_test
      retries: 8
      delay: 2
      until: api_test.status == 200

    - name: Print connection details
      debug:
        msg: |
          ================================
          GNS3 Server Installation Complete
          ================================
          REST API : http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}
          Test     : curl http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}/v2/version
          Binaries : /usr/local/bin/ubridge, /usr/local/bin/dynamips, /usr/local/bin/vpcs
          Logs     : journalctl -u gns3 -f

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart gns3
      systemd:
        name: gns3
        state: restarted
