---
# Simple GNS3-server installation without PPA dependencies
- name: Install and configure GNS3-server (Simple)
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  vars:
    gns3_host: "0.0.0.0"
    gns3_port: 3080
    gns3_user: gns3

  tasks:
    # Force stop any blocking processes
    - name: Force stop unattended upgrades
      shell: |
        systemctl stop unattended-upgrades || true
        pkill -f unattended-upgr || true
        rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock || true
      changed_when: false
      ignore_errors: yes

    # Install base dependencies
    - name: Install base packages and dependencies
      apt:
        name:
          - python3-pip
          - python3-dev
          - python3-venv
          - build-essential
          - qemu-kvm
          - qemu-utils
          - libvirt-clients
          - libvirt-daemon-system
          - bridge-utils
          - curl
          - wget
          - git
        state: present
        update_cache: yes
        lock_timeout: 300

    # Try to install from repos first (if available)
    - name: Try to install ubridge and dynamips from repos
      apt:
        name:
          - ubridge
          - dynamips
          - vpcs
        state: present
      ignore_errors: yes

    # Install GNS3 server via pip
    - name: Install gns3-server via pip
      pip:
        name: 
          - gns3-server
          - aiohttp-cors
        state: present
        executable: pip3

    # Create service user
    - name: Create gns3 service user
      user:
        name: "{{ gns3_user }}"
        system: yes
        shell: /usr/sbin/nologin
        create_home: yes
        home: /opt/gns3
        groups: kvm,libvirt

    # Create directories
    - name: Create GNS3 directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0755'
      loop:
        - /etc/gns3
        - /opt/gns3/images
        - /opt/gns3/projects
        - /var/log/gns3

    # Manual installation of missing tools if needed
    - name: Check if ubridge exists
      stat:
        path: /usr/bin/ubridge
      register: ubridge_check

    - name: Install ubridge from source if missing
      shell: |
        cd /tmp
        git clone https://github.com/GNS3/ubridge.git
        cd ubridge
        make
        sudo make install
      when: not ubridge_check.stat.exists
      ignore_errors: yes

    # Configuration
    - name: Create GNS3 server config
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0644'
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          cors = True
          console_start_port_range = 5000
          console_end_port_range = 5010
          images_path = /opt/gns3/images
          projects_path = /opt/gns3/projects
          
          [Qemu]
          enable_kvm = True
          require_kvm = False
      notify: restart gns3

    # Systemd service
    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/gns3.service
        content: |
          [Unit]
          Description=GNS3 Server
          After=network.target

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          ExecStart=/usr/local/bin/gns3server --config /etc/gns3/gns3_server.conf
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify:
        - reload systemd
        - restart gns3

    # Enable and start
    - name: Enable and start GNS3 service
      systemd:
        name: gns3
        enabled: yes
        state: started
        daemon_reload: yes

    # Open firewall ports if UFW is active
    - name: Check if UFW is active
      shell: ufw status | grep -q "Status. active"
      register: ufw_active
      failed_when: false
      changed_when: false

    - name: Open GNS3 ports in UFW
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ gns3_port }}"
        - "5000:5010"
      when: ufw_active.rc == 0

    # Show final info
    - name: Show connection info
      debug:
        msg: |
          ================================
          GNS3 Server Installation Complete!
          ================================
          
          REST API URL: http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}
          API Base URL: http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}/v2
          
          Test the API:
          curl http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}/v2/version
          
          For n8n HTTP nodes, use:
          Base URL: http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}
          
          Service commands:
          - Status: systemctl status gns3
          - Logs: journalctl -u gns3 -f
          - Restart: systemctl restart gns3

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart gns3
      systemd:
        name: gns3
        state: restarted