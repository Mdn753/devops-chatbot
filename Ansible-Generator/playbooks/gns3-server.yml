---
# gns3-server.yml — Install & expose a dedicated GNS3-server
# Tested on Ubuntu 22.04 → 25.04 (“Plucky”) and Debian-based guests
#
#   $ ansible-playbook -i inventory.ini gns3-server.yml
#
# Inventory group expected:  gns3-servers

- name: Install and configure GNS3-server
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  #############################################################################
  # ─────────────────────────  Adjustable variables  ─────────────────────────
  #############################################################################
  vars:
    gns3_host:    "0.0.0.0"     # expose REST API on all interfaces
    gns3_port:    3080
    gns3_user:    gns3          # dedicated non-login account
    gns3_service: gns3          # systemd unit name

  #############################################################################
  # ──────────────────────────────  Play steps  ───────────────────────────────
  #############################################################################
  tasks:
    # ------------------------------------------------------------------ tools
    - name: Install base packages we need (curl, add-apt-repository, etc.)
      apt:
        name:
          - curl
          - gnupg
          - software-properties-common   # brings add-apt-repository
        state: present
        update_cache: yes

    # ------------------------------------------------------ add Launchpad PPA
    - name: Add official GNS3 PPA (handles key import automatically)
      apt_repository:
        repo: "ppa:gns3/ppa"
        state: present
        update_cache: yes

    # -------------------------------------------------------- install server
    - name: Install gns3-server and helper binaries
      apt:
        name:
          - gns3-server
          - ubridge
          - dynamips
          - qemu-kvm
          - vpcs
        state: present
        update_cache: yes

    # -------------------------------------------------------- service account
    - name: Create dedicated service account
      user:
        name: "{{ gns3_user }}"
        system: yes
        shell: /usr/sbin/nologin

    # ----------------------------------------------------- main config file
    - name: Deploy /etc/gns3/gns3_server.conf
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0644'
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          console_start_port_range = 5000
          console_end_port_range   = 5010

          [Qemu]
          enable_kvm = True
      notify: Restart gns3-server

    # -------------------------------------------------- systemd service file
    - name: Ensure systemd unit exists (package ships one on recent releases)
      stat:
        path: /etc/systemd/system/{{ gns3_service }}.service
      register: unit_file

    - name: Provide minimal systemd unit (only if missing)
      copy:
        dest: /etc/systemd/system/{{ gns3_service }}.service
        mode: '0644'
        content: |
          [Unit]
          Description=GNS3 Server
          Wants=network-online.target
          After=network-online.target

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          ExecStart=/usr/bin/gns3server --config /etc/gns3/gns3_server.conf
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      when: not unit_file.stat.exists
      notify: Reload systemd

    # ------------------------------------------------------- enable & start
    - name: Enable and start gns3-server service
      service:
        name: "{{ gns3_service }}"
        state: started
        enabled: yes

    # ---------------------------------------------------- optional firewall
    - name: (Optional) open REST API port with UFW
      ufw:
        rule: allow
        port: "{{ gns3_port }}"
        proto: tcp
      when: "'ufw' in ansible_facts.packages"

  #############################################################################
  # ──────────────────────────────  Handlers  ────────────────────────────────
  #############################################################################
  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Restart gns3-server
      service:
        name: "{{ gns3_service }}"
        state: restarted
