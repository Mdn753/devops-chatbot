---
# Direct GNS3 installation without Python environments or PPAs
- name: Install GNS3-server directly
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  vars:
    gns3_host: "0.0.0.0"
    gns3_port: 3080
    gns3_user: gns3
    gns3_version: "2.2.48"

  tasks:
    # Stop any blocking processes
    - name: Stop unattended upgrades
      shell: |
        systemctl stop unattended-upgrades || true
        pkill -f unattended-upgr || true
        rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock || true
      changed_when: false
      ignore_errors: yes

    # Install base dependencies
    - name: Install base system packages
      apt:
        name:
          - wget
          - curl
          - qemu-kvm
          - qemu-utils
          - libvirt-daemon-system
          - bridge-utils
          - git
          - build-essential
          - python3
          - python3-pip
        state: present
        update_cache: yes
        lock_timeout: 300

    # Download and install GNS3 server directly
    - name: Download GNS3 server deb package
      get_url:
        url: "https://github.com/GNS3/gns3-server/releases/download/v{{ gns3_version }}/gns3-server_{{ gns3_version }}-1_all.deb"
        dest: "/tmp/gns3-server.deb"
        mode: '0644'
      ignore_errors: yes

    # Alternative: Install via pip with --break-system-packages
    - name: Install GNS3 server via pip (system-wide)
      shell: pip3 install --break-system-packages gns3-server
      when: ansible_failed_result is defined
      ignore_errors: yes

    # Try direct deb install first
    - name: Install GNS3 server from deb package
      apt:
        deb: "/tmp/gns3-server.deb"
        state: present
      ignore_errors: yes
      register: deb_install

    # Fallback to pip if deb fails
    - name: Install GNS3 via pip as fallback
      shell: pip3 install --break-system-packages gns3-server
      when: deb_install is failed
      ignore_errors: yes

    # Install ubridge from source
    - name: Clone and build ubridge
      shell: |
        cd /tmp
        rm -rf ubridge
        git clone https://github.com/GNS3/ubridge.git
        cd ubridge
        make clean || true
        make
        make install
      ignore_errors: yes

    # Install dynamips from source
    - name: Clone and build dynamips
      shell: |
        cd /tmp
        rm -rf dynamips
        git clone https://github.com/GNS3/dynamips.git
        cd dynamips
        mkdir -p build
        cd build
        cmake ..
        make
        make install
      ignore_errors: yes

    # Install VPCS
    - name: Install VPCS
      shell: |
        cd /tmp
        rm -rf vpcs
        git clone https://github.com/GNS3/vpcs.git
        cd vpcs/src
        make
        cp vpcs /usr/local/bin/
        chmod +x /usr/local/bin/vpcs
      ignore_errors: yes

    # Create service user
    - name: Create gns3 service user
      user:
        name: "{{ gns3_user }}"
        system: yes
        shell: /usr/sbin/nologin
        create_home: yes
        home: /opt/gns3
        groups: kvm,libvirt

    # Create directories
    - name: Create GNS3 directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0755'
      loop:
        - /etc/gns3
        - /opt/gns3/images
        - /opt/gns3/projects
        - /var/log/gns3

    # Configuration
    - name: Create GNS3 server config
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0644'
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          cors = True
          console_start_port_range = 5000
          console_end_port_range = 5010
          images_path = /opt/gns3/images
          projects_path = /opt/gns3/projects

          [Qemu]
          enable_kvm = True
          require_kvm = False
      notify: restart gns3

    # Find gns3server binary location
    - name: Find gns3server binary
      shell: which gns3server || find /usr -name gns3server 2>/dev/null | head -1 || echo "/usr/local/bin/gns3server"
      register: gns3server_path
      changed_when: false

    # Systemd service
    - name: Create systemd service
      copy:
        dest: /etc/systemd/system/gns3.service
        content: |
          [Unit]
          Description=GNS3 Server
          After=network.target

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          WorkingDirectory=/opt/gns3
          ExecStart={{ gns3server_path.stdout }} --config /etc/gns3/gns3_server.conf --log /var/log/gns3/gns3.log
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - reload systemd
        - restart gns3

    # Enable and start
    - name: Enable and start GNS3 service
      systemd:
        name: gns3
        enabled: yes
        state: started
        daemon_reload: yes

    # Open firewall ports
    - name: Check if UFW is active
      shell: ufw status | grep -q "Status. active"
      register: ufw_active
      failed_when: false
      changed_when: false

    - name: Open GNS3 ports in UFW
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ gns3_port }}"
        - "5000:5010"
      when: ufw_active.rc == 0

    # Verify installation
    - name: Wait for GNS3 to start
      wait_for:
        port: "{{ gns3_port }}"
        host: "{{ gns3_host }}"
        delay: 5
        timeout: 30
      ignore_errors: yes

    - name: Test GNS3 API
      uri:
        url: "http://localhost:{{ gns3_port }}/v2/version"
        method: GET
      register: api_test
      ignore_errors: yes

    # Show final info
    - name: Show connection info
      debug:
        msg: |
          ================================
          GNS3 Server Installation Complete!
          ================================
          
          REST API URL: http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}
          API Base URL: http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}/v2
          
          Test the API:
          curl http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}/v2/version
          
          API Test Result: {{ 'SUCCESS' if api_test.status == 200 else 'FAILED - Check logs' }}
          
          For n8n HTTP nodes, use:
          Base URL: http://{{ ansible_default_ipv4.address }}:{{ gns3_port }}
          
          Service commands:
          - Status: systemctl status gns3
          - Logs: journalctl -u gns3 -f
          - Config: /etc/gns3/gns3_server.conf

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart gns3
      systemd:
        name: gns3
        state: restarted