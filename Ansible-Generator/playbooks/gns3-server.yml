---
# gns3-server.yml — Install & expose GNS3-server (Plucky, Noble, Jammy …)
# Run: ansible-playbook -i inventory.ini gns3-server.yml

- name: Install & configure GNS3-server
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  vars:
    # ── PPA signing keys ─────────────────────────────────────────────
    gns3_keys:
      - 86C22C2EC6A24D7F        # “Launchpad PPA for GNS3” (historical)
      - 9A2FD067A2E3EF7B        # additional key used since 2024-10
    gns3_keyring: /usr/share/keyrings/gns3.gpg
    gns3_repo: >-
      deb [arch=amd64 signed-by={{ gns3_keyring }}]
      https://ppa.launchpadcontent.net/gns3/ppa/ubuntu
      {{ ansible_distribution_release }} main

    # ── Server settings ──────────────────────────────────────────────
    gns3_host:   "0.0.0.0"        # expose REST API
    gns3_port:   3080
    gns3_user:   gns3
    gns3_service: gns3

  tasks:
    - name: Install basic tools
      apt:
        name: [curl, gnupg, software-properties-common]
        state: present
        update_cache: yes

    # --- keyring ----------------------------------------------------
    - name: Remove any previous (possibly armoured) keyring
      file:
        path: "{{ gns3_keyring }}"
        state: absent

    - name: Download & de-armour BOTH PPA keys into one binary keyring
      shell: |
        set -e
        tmp=$(mktemp)
        for key in {{ gns3_keys|join(' ') }}; do
          curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${key}" >> "$tmp"
        done
        gpg --dearmor --yes --output "{{ gns3_keyring }}" "$tmp"
        rm "$tmp"
      args:
        warn: false
      changed_when: true

    - name: Correct permissions on keyring
      file:
        path: "{{ gns3_keyring }}"
        owner: root
        group: root
        mode: '0644'

    # --- repository -------------------------------------------------
    - name: Add GNS3 Launchpad PPA
      apt_repository:
        repo: "{{ gns3_repo }}"
        filename: gns3
        state: present
        update_cache: yes

    # --- packages ---------------------------------------------------
    - name: Install GNS3-server and helpers
      apt:
        name:
          - gns3-server
          - ubridge
          - dynamips
          - qemu-kvm
          - vpcs
        state: present
        update_cache: yes

    - name: Create dedicated service account
      user:
        name: "{{ gns3_user }}"
        system: yes
        shell: /usr/sbin/nologin

    - name: Deploy /etc/gns3/gns3_server.conf
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0644'
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          console_start_port_range = 5000
          console_end_port_range   = 5010

          [Qemu]
          enable_kvm = True
      notify: Restart gns3-server

    # systemd unit (only if package didn’t ship one)
    - name: Ensure systemd unit exists
      stat:
        path: /etc/systemd/system/{{ gns3_service }}.service
      register: unit

    - name: Install minimal systemd unit
      copy:
        dest: /etc/systemd/system/{{ gns3_service }}.service
        mode: '0644'
        content: |
          [Unit]
          Description=GNS3 Server
          Wants=network-online.target
          After=network-online.target

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          ExecStart=/usr/bin/gns3server --config /etc/gns3/gns3_server.conf
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      when: not unit.stat.exists
      notify: Reload systemd

    - name: Enable & start GNS3 service
      service:
        name: "{{ gns3_service }}"
        state: started
        enabled: yes

    - name: (Optional) open REST API port with UFW
      ufw:
        rule: allow
        port: "{{ gns3_port }}"
        proto: tcp
      when: "'ufw' in ansible_facts.packages"

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload

    - name: Restart gns3-server
      service:
        name: "{{ gns3_service }}"
        state: restarted
