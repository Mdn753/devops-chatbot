---
# gns3-server.yml — install & expose GNS3 on every host in group “gns3-servers”

- name: Install & configure a dedicated GNS3 server
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  ###################################################################
  # Variables (tweak these if you want a different bind address/port)
  ###################################################################
  vars:
    gns3_listen_host: "0.0.0.0"
    gns3_listen_port: 3080

    gns3_key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x86C22C2EC6A24D7F"
    gns3_keyring:  /usr/share/keyrings/gns3.gpg
    gns3_repo: >-
      deb [signed-by={{ gns3_keyring }}]
      https://ppa.launchpadcontent.net/gns3/ppa/ubuntu
      {{ 'jammy' }} main            # jammy builds run fine on 24.04, skip on 20.04

    # –– the correct unit shipped by the package ––
    gns3_service_name: gns3server               # <-- main change
    gns3_unit_path_pkg:  "/lib/systemd/system/{{ gns3_service_name }}.service"
    gns3_unit_path_local: "/etc/systemd/system/{{ gns3_service_name }}.service"

  ###################################################################
  # Pre-tasks: sanity checks
  ###################################################################
  pre_tasks:
    - name: Allow only Ubuntu ≥ 20.04
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version('20.04', '>=')
        fail_msg: >
          This playbook supports Ubuntu 20.04 LTS or newer
          (found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}).

    - name: Ensure helper pkg for add-apt-repository is present
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: yes

  ###################################################################
  # Tasks
  ###################################################################
  tasks:
    # -- 1 ▸ Add PPA & key (skip on 20.04) ---------------------------
    - name: Download GNS3 signing key
      ansible.builtin.get_url:
        url: "{{ gns3_key_url }}"
        dest: /tmp/gns3.asc
        mode: '0644'
      when: ansible_facts.distribution_version != '20.04'

    - name: Convert key to keyring
      ansible.builtin.command:
        cmd: gpg --dearmor -o {{ gns3_keyring }} /tmp/gns3.asc
      args:
        creates: "{{ gns3_keyring }}"
      when: ansible_facts.distribution_version != '20.04'

    - name: Add GNS3 PPA repository
      ansible.builtin.apt_repository:
        repo: "{{ gns3_repo }}"
        filename: gns3
        state: present
      when: ansible_facts.distribution_version != '20.04'

    # -- 2 ▸ Install packages ---------------------------------------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install GNS3 server + helpers
      ansible.builtin.apt:
        name:
          - gns3-server           # 2.2.x on focal, 3.x on jammy & noble
          - qemu-kvm
          - libvirt-daemon-system
          - ubridge
          - docker.io
        state: present

    - name: Ensure “ansible” service user exists
      ansible.builtin.user:
        name: ansible
        groups: sudo,kvm,libvirt,ubridge,docker
        append: yes
        create_home: yes

    # -- 3 ▸ Systemd unit handling ----------------------------------
    - name: Check if distro ships a unit file
      ansible.builtin.stat:
        path: "{{ gns3_unit_path_pkg }}"
      register: pkg_unit

    - name: Ensure override directory exists (when distro unit present)
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ gns3_service_name }}.service.d"
        state: directory
        mode: '0755'
      when: pkg_unit.stat.exists

    - name: Drop override to bind on {{ gns3_listen_host }}:{{ gns3_listen_port }}
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ gns3_service_name }}.service.d/override.conf"
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/gns3server --host {{ gns3_listen_host }} --port {{ gns3_listen_port }}
      when: pkg_unit.stat.exists
      notify:
        - reload systemd
        - restart gns3

    - name: Create custom {{ gns3_service_name }}.service when no distro unit
      ansible.builtin.copy:
        dest: "{{ gns3_unit_path_local }}"
        mode: '0644'
        content: |
          [Unit]
          Description=GNS3 server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ansible
          Group=ansible
          ExecStart=/usr/bin/gns3server --host {{ gns3_listen_host }} --port {{ gns3_listen_port }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      when: not pkg_unit.stat.exists
      notify:
        - reload systemd

    # -- 4 ▸ Enable & start service ---------------------------------
    - name: Enable and start gns3server service
      ansible.builtin.systemd:
        name: "{{ gns3_service_name }}"
        state: started
        enabled: yes

    # -- 5 ▸ Open firewall port (ufw) -------------------------------
    - name: Open port {{ gns3_listen_port }} in ufw
      ansible.builtin.ufw:
        rule: allow
        port: "{{ gns3_listen_port }}"
        proto: tcp
      when: ansible_facts.packages.ufw is defined

  ###################################################################
  # Handlers
  ###################################################################
  handlers:
    - name: reload systemd
      ansible.builtin.command: systemctl daemon-reload

    - name: restart gns3
      ansible.builtin.systemd:
        name: "{{ gns3_service_name }}"
        state: restarted
        daemon_reload: false

  ###################################################################
  # Post-tasks
  ###################################################################
  post_tasks:
    - ansible.builtin.debug:
        msg: >
          ✅ GNS3 should now be listening on {{ gns3_listen_host }}:{{ gns3_listen_port }}.
          Access it from Docker containers via http://host.docker.internal:{{ gns3_listen_port }}
