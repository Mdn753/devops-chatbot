---
# gns3-server.yml – install GNS3 3.x on every host in the gns3-servers group

- name: Install & configure a dedicated GNS3 server
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  #################################################################
  # Variables
  #################################################################
  vars:
    # Handy for log / debug messages; overridden automatically if you
    # still choose to pass `extra_vars: { new_vm_host: … }`
    new_vm_host: "{{ inventory_hostname }}"

  #################################################################
  # Pre-tasks: sanity checks
  #################################################################
  pre_tasks:
    - name: Verify we’re on Ubuntu 22.04 (Jammy)
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == "Debian"
          - ansible_facts['distribution_version'] is version('22.04', '==')
        fail_msg: "This playbook supports only Ubuntu 22.04 LTS."

    - name: Ensure helper tool for add-apt-repository is present
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: yes

  #################################################################
  # GNS3 installation
  #################################################################
  tasks:
    - name: Enable the official GNS3 PPA
      ansible.builtin.apt_repository:
        repo: ppa:gns3/ppa
        state: present

    - name: Install GNS3 daemon + hypervisor helpers
      ansible.builtin.apt:
        name:
          - gns3-server
          - qemu-kvm
          - libvirt-daemon-system
          - ubridge
          - docker.io
        state: present
        update_cache: yes

    - name: Ensure an “ansible” service user exists
      ansible.builtin.user:
        name: ansible
        groups: sudo
        append: yes
        create_home: yes

    - name: Add the user to KVM / Libvirt / ubridge / Docker groups
      ansible.builtin.user:
        name: ansible
        groups: kvm,libvirt,ubridge,docker
        append: yes

  #################################################################
  # Post-tasks
  #################################################################
  post_tasks:
    - name: Warn about re-login requirement
      ansible.builtin.debug:
        msg: >
          GNS3 installed on {{ new_vm_host }}.
          Log out and back in (or reboot) so the new group memberships take effect.
