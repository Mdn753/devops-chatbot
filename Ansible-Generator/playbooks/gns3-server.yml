---
# gns3-server.yml — Install & expose a dedicated GNS3 Server
# Execute on: hosts: gns3-servers
# Tested on Ubuntu 20.04/22.04 (Debian-based)

- name: Install & configure GNS3-server
  hosts: gns3-servers
  become: yes
  gather_facts: yes

  ###################################################################
  # Variables – override if you need a different repo, port, etc.
  ###################################################################
  vars:
    gns3_key_url:  "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x86C22C2EC6A24D7F"
    gns3_keyring:  /usr/share/keyrings/gns3.gpg
    gns3_repo:     "deb [signed-by={{ gns3_keyring }}] http://ppa.launchpad.net/gns3/ppa/ubuntu {{ ansible_distribution_release }} main"
    gns3_host:     "0.0.0.0"      # bind REST API to all interfaces
    gns3_port:     3080
    gns3_user:     gns3           # non-privileged service account
    gns3_service:  gns3           # name of the systemd unit

  ###################################################################
  # Tasks
  ###################################################################
  tasks:

    - name: Install prerequisites
      apt:
        name:
          - curl
          - gnupg
          - software-properties-common
        state: present
        update_cache: yes

    - name: Import GNS3 signing key
      get_url:
        url:  "{{ gns3_key_url }}"
        dest: "{{ gns3_keyring }}"
        mode: '0644'

    - name: Add GNS3 PPA repository
      apt_repository:
        repo: "{{ gns3_repo }}"
        filename: gns3
        state: present

    - name: Install GNS3-server and helpers
      apt:
        name:
          - gns3-server
          - ubridge
          - dynamips
          - qemu-kvm
          - vpcs
        state: present
        update_cache: yes

    - name: Create dedicated service account
      user:
        name: "{{ gns3_user }}"
        system: yes
        shell: /usr/sbin/nologin

    - name: Deploy /etc/gns3/gns3_server.conf
      copy:
        dest: /etc/gns3/gns3_server.conf
        owner: "{{ gns3_user }}"
        group: "{{ gns3_user }}"
        mode: '0644'
        content: |
          [Server]
          host = {{ gns3_host }}
          port = {{ gns3_port }}
          auth = False
          console_start_port_range = 5000
          console_end_port_range   = 5010

          [Qemu]
          enable_kvm = True
      notify: Restart gns3-server

    - name: Install minimal systemd unit (if package didn’t ship one)
      copy:
        dest: /etc/systemd/system/{{ gns3_service }}.service
        mode: '0644'
        content: |
          [Unit]
          Description=GNS3 Server
          Wants=network-online.target
          After=network-online.target

          [Service]
          User={{ gns3_user }}
          Group={{ gns3_user }}
          ExecStart=/usr/bin/gns3server --config /etc/gns3/gns3_server.conf
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      register: unit_added
      notify: Reload systemd
      when: not lookup('ansible.builtin.systemd', gns3_service, errors='ignore').stdout

    - name: Enable & start GNS3 service
      service:
        name: "{{ gns3_service }}"
        state: started
        enabled: yes

    - name: (Optional) Allow REST API through UFW
      ufw:
        rule: allow
        port: "{{ gns3_port }}"
        proto: tcp
      when: "'ufw' in ansible_facts.packages"

  ###################################################################
  # Handlers
  ###################################################################
  handlers:
    - name: Reload systemd
      command: systemctl daemon-reload
      listen: Reload systemd

    - name: Restart gns3-server
      service:
        name: "{{ gns3_service }}"
        state: restarted
