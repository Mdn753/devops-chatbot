---
# gns3-server.yml — install & expose GNS3 on all hosts in “gns3-servers”

- name: Install & configure a dedicated GNS3 server
  hosts: gns3-servers
  become: yes
  gather_facts: yes
  collections:
    - community.general          # for the ufw module

  ###################################################################
  # Tunables
  ###################################################################
  vars:
    gns3_listen_host: "0.0.0.0"
    gns3_listen_port: 3080

    gns3_key_url:  "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x86C22C2EC6A24D7F"
    gns3_keyring:  /usr/share/keyrings/gns3.gpg
    gns3_repo: >-
      deb [signed-by={{ gns3_keyring }}]
      https://ppa.launchpadcontent.net/gns3/ppa/ubuntu
      {{ 'jammy' }} main

    gns3_service_name: gns3server
    gns3_override_dir:  "/etc/systemd/system/{{ gns3_service_name }}.service.d"
    gns3_override_file: "{{ gns3_override_dir }}/override.conf"

    # venv path for Ubuntu ≥ 23.10
    gns3_venv_dir: /opt/gns3
    gns3_server_version: "3.0.0"

  ###################################################################
  # Pre-tasks
  ###################################################################
  pre_tasks:

    - name: Require Ubuntu 20.04 or newer
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Ubuntu"
          - ansible_facts.distribution_version is version('20.04', '>=')
        fail_msg: >
          Only Ubuntu 20.04 LTS or newer is supported
          (found {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}).

    - name: Ensure add-apt-repository helper is installed
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: yes

  ###################################################################
  # Tasks
  ###################################################################
  tasks:

    # ── Add GNS3 PPA (skip on focal) ───────────────────────────────
    - name: Download GNS3 signing key
      ansible.builtin.get_url:
        url: "{{ gns3_key_url }}"
        dest: /tmp/gns3.asc
        mode: "0644"
      when: ansible_facts.distribution_version != "20.04"

    - name: Convert key to keyring
      ansible.builtin.command:
        cmd: gpg --dearmor -o {{ gns3_keyring }} /tmp/gns3.asc
      args:
        creates: "{{ gns3_keyring }}"
      when: ansible_facts.distribution_version != "20.04"

    - name: Add GNS3 PPA repository
      ansible.builtin.apt_repository:
        repo: "{{ gns3_repo }}"
        filename: gns3
        state: present
      when: ansible_facts.distribution_version != "20.04"

    # ── Path A: Ubuntu ≤ 22.04 (install via APT) ──────────────────
    - name: Install gns3-server + helpers from APT
      ansible.builtin.apt:
        name:
          - gns3-server
          - qemu-kvm
          - libvirt-daemon-system
          - ubridge
          - docker.io
        state: present
        update_cache: yes
      when: ansible_facts.distribution_version is version('23.10', '<')

    # ── Path B: Ubuntu ≥ 23.10 (Python 3.12) → build venv ──────────
    - name: Enable “universe” pocket
      ansible.builtin.command: add-apt-repository -y universe
      changed_when: false
      when: ansible_facts.distribution_version is version('23.10', '>=')

    - name: Refresh APT cache
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts.distribution_version is version('23.10', '>=')

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto
      when: ansible_facts.distribution_version is version('23.10', '>=')

    - name: Add deadsnakes PPA if python3.11 is still missing
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present
      when:
        - ansible_facts.distribution_version is version('23.10', '>=')
        - "'python3.11' not in (ansible_facts.packages | default({}))"

    - name: Install python3.11, venv & build deps
      ansible.builtin.apt:
        name:
          - python3.11
          - python3.11-venv
          - build-essential
          - qemu-kvm
          - libvirt-daemon-system
          - ubridge
          - docker.io
        state: present
        update_cache: yes
      when: ansible_facts.distribution_version is version('23.10', '>=')

    - name: Create {{ gns3_venv_dir }} virtual-env
      ansible.builtin.command: python3.11 -m venv {{ gns3_venv_dir }}
      args:
        creates: "{{ gns3_venv_dir }}/bin/activate"
      become_user: ansible
      when: ansible_facts.distribution_version is version('23.10', '>=')

    - name: Install gns3-server {{ gns3_server_version }} into venv
      ansible.builtin.pip:
        name: "gns3-server=={{ gns3_server_version }}"
        virtualenv: "{{ gns3_venv_dir }}"
        virtualenv_python: python3.11
      become_user: ansible
      when: ansible_facts.distribution_version is version('23.10', '>=')

    # ── Systemd override (both paths) ──────────────────────────────
    - name: Ensure override directory exists
      ansible.builtin.file:
        path: "{{ gns3_override_dir }}"
        state: directory
        mode: "0755"

    - name: Drop ExecStart override
      ansible.builtin.copy:
        dest: "{{ gns3_override_file }}"
        mode: "0644"
        content: |
          [Service]
          ExecStart=
          {%- if ansible_facts.distribution_version is version('23.10', '>=') -%}
          ExecStart={{ gns3_venv_dir }}/bin/gns3server --host {{ gns3_listen_host }} --port {{ gns3_listen_port }}
          {%- else -%}
          ExecStart=/usr/bin/gns3server --host {{ gns3_listen_host }} --port {{ gns3_listen_port }}
          {%- endif -%}
      notify:
        - reload systemd
        - restart gns3

    # ── Enable & start service ─────────────────────────────────────
    - name: Enable and start {{ gns3_service_name }}
      ansible.builtin.systemd:
        name: "{{ gns3_service_name }}"
        state: started
        enabled: yes

    # ── Open firewall (if ufw installed) ───────────────────────────
    - name: Allow {{ gns3_listen_port }}/tcp via UFW
      community.general.ufw:
        rule: allow
        port: "{{ gns3_listen_port }}"
        proto: tcp
      when: "'ufw' in (ansible_facts.packages | default({}))"

  ###################################################################
  # Handlers
  ###################################################################
  handlers:
    - name: reload systemd
      ansible.builtin.command: systemctl daemon-reload

    - name: restart gns3
      ansible.builtin.systemd:
        name: "{{ gns3_service_name }}"
        state: restarted
        daemon_reload: false

  ###################################################################
  # Post-tasks
  ###################################################################
  post_tasks:
    - ansible.builtin.debug:
        msg: |
          ✅ GNS3 should now be listening on {{ gns3_listen_host }}:{{ gns3_listen_port }}.
          From Docker Desktop on Windows reach it via:
            http://host.docker.internal:{{ gns3_listen_port }}
