version: "3.1"

intents:
  - greet
  - create_vm
  - setup_zabbix

responses:
  utter_greet:
    - text: "Hi! How can I help you?"
  utter_setup_zabbix_started:
    - text: "Kicking off Zabbix setup…"

actions:
  - action_create_vm
  - action_setup_zabbix

slots:
  vm_name:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: vm_name

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
