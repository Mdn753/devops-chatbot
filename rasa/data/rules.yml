version: "3.1"

rules:
- rule: create vm
  steps:
  - intent: create_vm
  - action: action_create_vm
- rule: setup zabbix
  steps:
    - intent: setup_zabbix
    - action: action_setup_zabbix
- rule: setup GNS3
  steps:
    - intent: setup_GNS3  
    - action: action_setup_GNS3
- rule: start deploy form
  steps:
    - intent: deploy_app
    - action: deploy_form
    - active_loop: deploy_form
- rule: submit deploy form
  condition:
    - active_loop: deploy_form
  steps:
    - action: deploy_form
    - active_loop: null
    - action: action_launch_deploy
    - action: utter_deploy_started